function guideMarkdown(g, { screen = false } = {}) {
  return [
    `:::understood\nYou want the steps to ${g.title.charAt(0).toLowerCase() + g.title.slice(1)} in ${g.app}. Here's the checklist, from my built-in guides (0 tokens).\n:::`,
    `### ${g.title}`,
    g.before.length ? "**Before you start**\n" + g.before.map((b) => `- [ ] ${b}`).join("\n") : "",
    "**Steps**\n" + g.steps.map((s) => `- [ ] ${s}`).join("\n"),
    g.example ? `**Example:** \`${g.example}\`` : "",
    g.gotchas.length ? "**Watch out**\n" + g.gotchas.map((x) => `- ${x}`).join("\n") : "",
    screen
      ? `:::better\nYou can make this experience better if you tap the eye button and ask “Hey Otter, where's the next step?” while you're on that screen. I'll circle it on a snapshot. That sends one picture of your screen to Claude, so only do it when nothing sensitive is showing.\n:::`
      : `:::better\nYou can make this experience better if you tell me which step you're on and what you see; I'll take it from there. (Screen coaching is on hold until BMCC approves it.)\n:::`,
  ].filter(Boolean).join("\n\n");
}

// ---- core/router.js ----
// Cost-aware routing. Every request takes the cheapest route that can do the job:
//   local    - answered by O.T.T.E.R. itself, 0 tokens
//   quick    - short context, low effort, few tools
//   standard - sources, skills and tools
//   deep     - high effort, web research, more tool rounds
// A request that would merit "deep" runs as "standard" first unless the user asked for depth,
// and the answer offers the deeper route with its estimate. Estimates are rough (about 4
// characters per token, +/-25%) and say so; the local server reports exact usage afterwards.

const IMAGE_TOKENS = 1600; // a 1280x720 screen snapshot is about (1280*720)/750 tokens, rounded up

const PRICES = { // USD per million tokens, from Anthropic's published table (cached 2026-10-06)
  "claude-opus-5-5": { in: 4, out: 20 },
  "claude-sonnet-5-5": { in: 2, out: 10 },
  "claude-haiku-5-5": { in: 0.1, out: 0.5 },
};

const TIERS = {
  local: { label: "Local (no Claude)", effort: null, modelTier: null, rounds: 0, outMax: 0, historyTurns: 0, knowledge: 0 },
  quick: { label: "Quick", effort: "low", modelTier: "quick", rounds: 1, outTypical: 500, outMax: 2500, historyTurns: 4, knowledge: 2, tools: ["check_capability", "propose_action", "search_knowledge", "point_at"] },
  standard: { label: "Standard", effort: "medium", modelTier: "default", rounds: 2, outTypical: 1800, outMax: 8000, historyTurns: 12, knowledge: 5, tools: null },
  deep: { label: "Deep", effort: "high", modelTier: "complex", rounds: 4, outTypical: 4500, outMax: 20000, historyTurns: 16, knowledge: 5, tools: null, web: true },
};

// Fixed overhead measured from the real system prompt and tool list (rounded up).
const OVERHEAD = { system: 2900, toolsAll: 1400, toolsQuick: 800 }; // measured 2026-10-14: prompt ~2.7k, tools ~1.0k / 0.46k, plus API tool preamble

const estimateTokens = (text) => Math.ceil(String(text || "").length / 4);

const DEEP_ASK = /\b(deep(er)?|thorough(ly)?|in[- ]depth|comprehensive|full (analysis|report|research)|research (this|it|the)|dig into|go deeper|everything you can find)\b/i;
const SOURCE_REF = /\b(S\d+|attached|this (email|thread|document|doc|budget|file)|the (email|thread|document|budget|attachment)s?|above)\b/i;
const SMALL_TALK = /^(hi|hello|hey|thanks|thank you|ok(ay)?|great|good (morning|afternoon)|got it|cool)[.!]*$/i;
const ABILITY_Q = /\b(can|could|are) you\b|\bable to\b|\bwhy can'?t you\b|\bwhat can'?t you\b/i;

function costUsd(model, input, output) {
  const p = PRICES[model];
  if (!p) return null;
  return (input * p.in + output * p.out) / 1e6;
}

// ctx: {plan, sources: [{id,text}], history: [{content}], engineKind, webAllowed, capabilities, forceTier, model, quickModel}
function chooseRoute(text, ctx = {}) {
  const reasons = [];
  const t = String(text || "").trim();
  if (parseCommand(t)) return finish("local", ["A voice or volume command O.T.T.E.R. handles itself."], ctx, t);
  if (SMALL_TALK.test(t)) return finish("local", ["Small talk; no need to spend tokens."], ctx, t);
  if (/^(run (the )?(morning|daily) check|verify yourself|self[- ]check|morning check)\b/i.test(t)) return finish("local", ["Runs the built-in verification, which uses no tokens."], ctx, t);
  const capHits = matchCapabilities(t, ctx.capabilities || []);
  if (capHits.length && ABILITY_Q.test(t) && t.length < 160 && capHits.every((c) => c.status !== "ready"))
    return finish("local", ["A question about something O.T.T.E.R. can't do yet; it explains that from its own status list."], ctx, t);
  if (!ctx.images && findGuide(t)) return finish("local", ["A built-in Power Automate, Forms or Excel guide covers this."], ctx, t);
  if (ctx.engineKind === "offline") return finish("local", ["No Claude connection; built-in analyzers only."], ctx, t);

  let tier = "quick";
  const frames = ctx.plan?.frames || [];
  const intents = ctx.plan?.intents || [];
  const analysisSkills = (ctx.plan?.steps || []).filter((s) => s.mode === "analysis").length;
  const refersToSources = (ctx.sources || []).length > 0 && (SOURCE_REF.test(t) || frames.includes("email") || frames.includes("discrepancy"));
  if (refersToSources) { tier = "standard"; reasons.push("Uses the attached sources."); }
  if (frames.includes("decision") || intents.includes("new_program")) { tier = "standard"; reasons.push("A decision needs the full recommendation frame."); }
  if (analysisSkills) { tier = "standard"; reasons.push(`${analysisSkills} of your skills inform this.`); }
  if (t.length > 600) { tier = "standard"; reasons.push("Long request."); }
  if (ctx.images) reasons.push("Includes one snapshot of your screen (about 1,600 tokens).");
  const wantsDepth = DEEP_ASK.test(t);
  const meritsDeep = wantsDepth || intents.includes("research") || intents.includes("grant") || frames.includes("decision");
  if (wantsDepth) { tier = "deep"; reasons.push("You asked for depth."); }
  if (ctx.forceTier) { tier = ctx.forceTier; reasons.splice(0, reasons.length, `You chose the ${tier} route.`); }
  if (tier === "quick") reasons.push("Short question with no sources: cheapest route.");
  const route = finish(tier, reasons, ctx, t, refersToSources || tier !== "quick");
  // Lowest first: offer the next route up instead of spending on it unasked.
  if (tier !== "deep" && meritsDeep && !ctx.forceTier) route.upgrade = { tier: "deep", why: ctx.engineKind === "server" && ctx.webAllowed ? "High effort with web research and citations." : "High effort and more tool rounds.", estimate: finish("deep", [], ctx, t, true).estimate };
  else if (tier === "quick" && ((ctx.sources || []).length || (ctx.plan?.steps || []).length)) route.upgrade = { tier: "standard", why: "Include your attached sources and skills.", estimate: finish("standard", [], ctx, t, true).estimate };
  return route;
}

function finish(tier, reasons, ctx, text, includeSources = false) {
  const T = TIERS[tier];
  if (tier === "local") return { tier, label: T.label, reasons, include: {}, estimate: { input: 0, output: 0, total: 0, perRound: 0, rounds: 0, costUsd: 0, exact: true } };
  const history = (ctx.history || []).slice(-T.historyTurns);
  const sources = includeSources ? ctx.sources || [] : [];
  const perRound = (ctx.images || 0) * IMAGE_TOKENS + OVERHEAD.system + (T.tools ? OVERHEAD.toolsQuick : OVERHEAD.toolsAll) + estimateTokens(text) + history.reduce((a, h) => a + estimateTokens(h.content), 0) + sources.reduce((a, s) => a + estimateTokens(s.text), 0) + T.knowledge * 120;
  // Each tool round resends the whole conversation, so input grows with rounds.
  const input = Math.round(perRound * T.rounds + (T.rounds - 1) * 600);
  const output = T.outTypical;
  const model = tier === "quick" && ctx.quickModel ? ctx.quickModel : ctx.model || "claude-opus-5-5";
  return {
    tier, label: T.label, reasons, model,
    effort: T.effort, modelTier: T.modelTier,
    include: { sources: includeSources, historyTurns: T.historyTurns, knowledge: T.knowledge, tools: T.tools, web: !!T.web && !!ctx.webAllowed },
    estimate: { input, output, outputMax: T.outMax, total: input + output, perRound, rounds: T.rounds, costUsd: ctx.engineKind === "server" || ctx.engineKind === "direct" ? costUsd(model, input, output) : null, exact: false },
  };
}

function fmtTokens(n) {
  if (n == null) return "?";
  if (n < 1000) return String(n);
  return (n / 1000).toFixed(n < 10000 ? 1 : 0) + "k";
}

function describeEstimate(route, engineKind) {
  if (route.tier === "local") return "0 tokens (answered locally)";
  const e = route.estimate;
  const money = e.costUsd != null ? `, about $${e.costUsd < 0.01 ? e.costUsd.toFixed(3) : e.costUsd.toFixed(2)}` : "";
  const where = engineKind === "artifact" ? " of your claude.ai plan usage" : "";
  return `about ${fmtTokens(e.total)} tokens${where} (${fmtTokens(e.input)} in, ~${fmtTokens(e.output)} out, up to ${fmtTokens(e.outputMax)} with thinking${money})`;
}

// ---- core/verify.js ----
// Morning verification: shared scheduling logic, browser-side checks, and the report shape.
// Every check returns {id, name, status: pass|warn|fail, detail, fix}. Verification uses no
// Claude tokens unless the optional live check is switched on, and the report says so.

const VERIFY_HOUR = 5;

// Next 5:00 a.m. local time strictly after `now`.
function nextRunAt(now = new Date(), hour = VERIFY_HOUR) {
  const d = new Date(now);
  d.setHours(hour, 0, 0, 0);
  if (d <= now) d.setDate(d.getDate() + 1);
  return d;
}

// The most recent 5:00 a.m. at or before `now`.
function lastScheduledAt(now = new Date(), hour = VERIFY_HOUR) {
  const d = new Date(now);
  d.setHours(hour, 0, 0, 0);
  if (d > now) d.setDate(d.getDate() - 1);
  return d;
}

// True when no verification has run since the last 5 a.m. (computer asleep, server off).
function needsCatchUp(lastRanAt, now = new Date(), hour = VERIFY_HOUR) {
  return !lastRanAt || new Date(lastRanAt) < lastScheduledAt(now, hour);
}

const check = (id, name, status, detail, fix = "") => ({ id, name, status, detail, fix });

// Checks that need no server: they run in any browser, including claude.ai.
function browserChecks(env) {
  const out = [];
  out.push(env.engineKind === "offline"
    ? check("engine", "Claude connection", "fail", "No Claude connection: only built-in analyzers run.", "Open the claude.ai link signed in, or start the local server with ANTHROPIC_API_KEY set.")
    : env.serviceApproved ? check("engine", "Claude connection", "pass", `Connected (${env.engineLabel}).`)
      : check("engine", "Claude connection", "warn", "Connected but not approved for BMCC content, so nothing is sent.", "Settings > Engine: confirm BMCC permits it."));
  out.push(env.storage ? check("storage", "Local storage", "pass", "History and settings are saving on this device.") : check("storage", "Local storage", "fail", "This browser is blocking storage, so nothing is saved between visits.", "Leave private browsing, or allow site data for this page."));
  const sp = env.speech || {};
  if (!sp.synthesis) out.push(check("voice", "Voice", "warn", "This browser can't speak.", "Use Edge, Chrome or Safari."));
  else if (!sp.maleVoice) out.push(check("voice", "Voice", "warn", sp.cloudMaleVoice ? `Only an online male voice is available ("${sp.cloudMaleVoice}") and online voices are off.` : "No male voice is installed.", sp.cloudMaleVoice ? "Settings > Voice > Allow online voices, if BMCC policy allows." : "Mac: download Evan or Nathan (Enhanced). Windows: use Edge."));
  else out.push(check("voice", "Voice", sp.maleVoiceNatural ? "pass" : "warn", `Speaking as "${sp.maleVoice}"${sp.maleVoiceNatural ? "" : ", which sounds synthetic"}.`, sp.maleVoiceNatural ? "" : "Allow online voices, or install a natural voice."));
  if (env.serverRunning) out.push(sp.recognition ? (sp.recognitionAllowed ? check("listen", "Listening", "pass", "Conversation mode can hear you.") : check("listen", "Listening", "warn", "Listening is not allowed yet.", "Settings > Voice > Allow listening.")) : check("listen", "Listening", "warn", "This browser has no speech recognition.", "Use Chrome, Edge or Safari."));
  const stale = (env.pending || []).filter((p) => env.now - p.createdAt > 3 * 86400000);
  out.push(stale.length ? check("approvals", "Approval queue", "warn", `${stale.length} proposal${stale.length === 1 ? " has" : "s have"} waited more than 3 days.`, "Open Tasks and approve or cancel them; stale drafts tend to go out of date.") : check("approvals", "Approval queue", "pass", `${(env.pending || []).length} waiting, none stale.`));
  const expired = (env.knowledge || []).filter((k) => k.expiresAt && k.expiresAt < env.now);
  if (expired.length) out.push(check("knowledge", "Knowledge base", "warn", `${expired.length} stored fact${expired.length === 1 ? " has" : "s have"} expired.`, "Settings > Knowledge base: update or delete them."));
  // The privacy guard is checked against known samples every morning.
  const ok = evaluateOutbound("SSN 123-45-6789", "x", { approvedServices: ["x"] }).decision === "block" && scanSensitive("jane@bluecc.edu").length === 1 && evaluateOutbound("Student ID 7012345 GPA 1.9", "x", { approvedServices: ["x"] }).decision === "block";
  out.push(ok ? check("privacy", "Privacy guard", "pass", "Blocks SSNs and student records, detects contact details.") : check("privacy", "Privacy guard", "fail", "The privacy guard failed its self-test. Sending is unsafe.", "Stop using Claude features and report this; run npm test on the local server."));
  if (env.serverRunning && env.serverReport) {
    const age = env.now - new Date(env.serverReport.ranAt).getTime();
    out.push(age < 26 * 3600000 ? check("server_verify", "Server self-test", "pass", `Last ran ${new Date(env.serverReport.ranAt).toLocaleString()}.`) : check("server_verify", "Server self-test", "warn", "The server's morning test hasn't run in over a day.", "Leave the local server running overnight, or schedule npm run verify (see README)."));
  }
  return out;
}

// Merges browser and server checks with today's limits into one report.
function buildReport({ trigger, env, serverReport = null, now = Date.now() }) {
  const checks = [...browserChecks({ ...env, now, serverReport }), ...(serverReport?.checks || [])];
  const caps = assessCapabilities(env);
  const limits = caps.filter((c) => c.status !== "ready").map((c) => ({ id: c.id, name: c.name, status: STATUS_TEXT[c.status], why: c.why, missing: c.missing, unlocks: c.unlocks }));
  const issues = checks.filter((c) => c.status !== "pass").sort((a, b) => (a.status === "fail" ? -1 : 1) - (b.status === "fail" ? -1 : 1));
  return {
    ranAt: new Date(now).toISOString(),
    trigger,
    checks,
    issues,
    limits,
    tokensUsed: serverReport?.tokensUsed || 0,
    summary: `${checks.filter((c) => c.status === "pass").length} passed, ${issues.filter((c) => c.status === "warn").length} warnings, ${issues.filter((c) => c.status === "fail").length} failures. ${limits.length} limits today.`,
  };
}

function reportMarkdown(r, { maxLimits = 4 } = {}) {
  const top = r.issues.slice(0, 4);
  const lines = [
    ":::finding",
    `**Morning check** (${new Date(r.ranAt).toLocaleString()}, ${r.trigger}): ${r.summary} Used ${r.tokensUsed} Claude tokens.`,
    ":::",
  ];
  if (top.length) {
    lines.push("", "**Issues and fixes**");
    for (const c of top) lines.push(`- **${c.name}** (${c.status}): ${c.detail}${c.fix ? ` Fix: ${c.fix}` : ""}`);
  } else lines.push("", "No issues found.");
  if (r.limits.length) {
    lines.push("", "**Limits today, given your current setup**");
    for (const l of r.limits.slice(0, maxLimits)) lines.push(`- **${l.name}** (${l.status.toLowerCase()}): ${l.why} Missing piece: ${l.missing}`);
    if (r.limits.length > maxLimits) lines.push(`- …and ${r.limits.length - maxLimits} more on the Abilities page.`);
  }
  return lines.join("\n");
}

// ---- core/learn.js ----
// Learning: what O.T.T.E.R. knows about Dr. Prevot and how it picks up more. It starts from
// the setup brief, notices stable preferences and facts in what he says ("I prefer…", "from
// now on…", "remember that…", corrections), and asks before keeping any of them. Nothing
// sensitive is ever proposed for memory, and everything learned can be seen and forgotten.

// Facts from the original O.T.T.E.R. brief, written by Dr. Prevot. Provenance is kept so
// they can be corrected or expired like anything else.
const PROFILE_SEED = [
  ["Role", "Executive Director of Community Education and Workforce Training at Blue Mountain Community College (BMCC), Oregon. Oversees CE workshops and noncredit programs, Workforce Training, BMCC centers, campuses and coordinators, supervision, partnerships and economic development, program pricing and budgets, grants, employer engagement, enrollment growth."],
  ["BMCC strategic priorities", "Students First; Grow Enrollment; Community Engagement; Vibrant Workplace Culture; Fiscal Sustainability."],
  ["Management philosophy", "Practical experimentation, measurable outcomes, entrepreneurship, accountability, efficiency, decisions grounded in reliable data."],
  ["How to talk to me", "Bottom line first (never write the word BLUF), then reasoning. Concise, direct, analytical. No flattery, no filler, no em dashes. Push back on weak assumptions and explain tradeoffs. Ask before using any connector."],
  ["Hard rules", "Nothing is sent, submitted, posted, changed or deleted without my explicit approval. Signed-in does not mean authorized. FERPA and BMCC policy come first. Never invent evidence."],
  ["Service area", "Rural northeastern Oregon. Centers and partners mentioned in my skills include Boardman (Morrow County), Hermiston and the West End of Umatilla County, Milton-Freewater, Baker County, and Contracted Out of District agreements with Grant and Union counties."],
  ["Recurring work", "Monthly board report, Office of Instruction meeting notes, CD and COD coordinator meeting, FTE reports from Conclusive Systems, workshop setup (course request, trainer contract, website), IR data requests, policy reviews, the I2PA pre-apprenticeship grant, brand perception scans."],
];

function seedProfile(knowledge, now = Date.now()) {
  if (knowledge.some((k) => k.tags?.includes("profile"))) return 0;
  let n = 0;
  for (const [title, text] of PROFILE_SEED) {
    knowledge.push({ id: "kb_profile_" + n, title, text, tags: ["profile"], provenance: "Your O.T.T.E.R. setup brief", createdAt: now, updatedAt: now, expiresAt: null });
    n++;
  }
  return n;
}

const PATTERNS = [
  /\b(?:I|we) (?:really )?(?:prefer|like|want|need|hate|dislike|don't like|do not like|can't stand)\b[^.?!]*/i,
  /\b(?:from now on|going forward|in the future|next time|always|never)\b[^.?!]*/i,
  /\bremember (?:that )?[^.?!]+/i,
  /\bcall me [^.?!]+/i,
  /\bmy (?:boss|supervisor|assistant|director|dean|president|vp|vice president|counterpart|team|budget cycle|fiscal year|board meeting)\b[^.?!]*\b(?:is|are|meets?|starts?|ends?)\b[^.?!]*/i,
  /\b(?:no|actually),? (?:I meant|I mean|it's|it is)\b[^.?!]*/i,
];

// Returns up to two short candidate facts worth asking about, or none.
function extractLearnables(text, knowledge = []) {
  const t = String(text || "").replace(/\s+/g, " ").trim();
  if (t.length < 12 || t.length > 1200) return [];
  const out = [];
  for (const re of PATTERNS) {
    const m = t.match(re);
    if (!m) continue;
    let fact = m[0].trim().replace(/^(?:remember (?:that )?)/i, "");
    if (fact.length < 10 || fact.length > 220) continue;
    if (scanSensitive(fact).length) continue; // never offer to remember identifiers or contact details
    if (/\b(student|grade|gpa|ssn|salary of|disciplin|medical|diagnos)/i.test(fact)) continue;
    const norm = fact.toLowerCase();
    if (knowledge.some((k) => k.text.toLowerCase().includes(norm))) continue;
    if (!out.some((o) => o.toLowerCase() === norm)) out.push(fact.charAt(0).toUpperCase() + fact.slice(1));
    if (out.length >= 2) break;
  }
  return out;
}

// Profile and learned facts always travel with the request (they are short), so Claude can
// use what it knows instead of asking.
function profileText(knowledge, maxChars = 2200) {
  const items = knowledge.filter((k) => k.tags?.includes("profile") || k.tags?.includes("learned"));
  let out = "";
  for (const k of items) {
    const line = `- ${k.title}: ${k.text}\n`;
    if (out.length + line.length > maxChars) break;
    out += line;
  }
  return out.trim();
}

// ---- core/ledger.js ----
// Verifiable activity ledger. Every session event and every byte that leaves the device is
// recorded as a hash-chained entry: each entry's hash covers its content and the previous
// entry's hash, so editing, deleting or reordering any entry breaks the chain from that point.
// Entries describe what happened (when, where to, how many bytes and tokens, a fingerprint of
// the payload) and never the content itself. scripts/verify-log.mjs checks an exported ledger
// independently of the app.

const GENESIS = "0".repeat(64);
// The only place O.T.T.E.R. may send anything in closed mode.
const ALLOWED_HOSTS = ["api.anthropic.com"];

async function entryHash(e) {
  const { hash, ...body } = e;
  return sha256(canonical(body));
}

class Ledger {
  constructor(entries = [], { now = () => Date.now(), limit = 5000, onChange = () => {} } = {}) {
    this.entries = entries;
    this.now = now;
    this.limit = limit;
    this.onChange = onChange;
    this.queue = Promise.resolve();
  }
  get head() {
    return this.entries.length ? this.entries[this.entries.length - 1].hash : GENESIS;
  }
  // Appends are serialized so the chain order matches the call order.
  append(type, detail = {}) {
    this.queue = this.queue.then(async () => {
      const safe = {};
      for (const [k, v] of Object.entries(detail)) if (!["content", "text", "body", "image", "payload"].includes(k)) safe[k] = v;
      const prev = this.entries[this.entries.length - 1];
      const e = { seq: prev ? prev.seq + 1 : 1, ts: new Date(this.now()).toISOString(), type, detail: safe, prev: prev ? prev.hash : GENESIS };
      e.hash = await entryHash(e);
      this.entries.push(e);
      if (this.entries.length > this.limit) this._compact();
      this.onChange(e);
      return e;
    });
    return this.queue;
  }
  // Oldest entries are replaced by one checkpoint that carries the dropped range's last hash,
  // so the remaining chain still verifies from the checkpoint.
  _compact() {
    const drop = this.entries.length - Math.floor(this.limit * 0.8);
    const dropped = this.entries.splice(0, drop);
    const last = dropped[dropped.length - 1];
    this.entries.unshift({ seq: last.seq, ts: last.ts, type: "checkpoint", detail: { droppedFrom: dropped[0].seq, droppedTo: last.seq }, prev: "checkpoint", hash: last.hash });
  }
  export() {
    return JSON.stringify({ format: "otter-ledger-1", exportedAt: new Date(this.now()).toISOString(), head: this.head, entries: this.entries }, null, 2);
  }
}

// Returns {ok, count, brokenAt, reason}. Works on an exported ledger with no app code.
async function verifyChain(entries) {
  let prevHash = null;
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    if (e.type === "checkpoint" && i === 0) { prevHash = e.hash; continue; }
    const expectedPrev = i === 0 ? GENESIS : prevHash;
    if (e.prev !== expectedPrev) return { ok: false, count: entries.length, brokenAt: e.seq, reason: "link to the previous entry doesn't match (an entry was removed, inserted or reordered)" };
    if ((await entryHash(e)) !== e.hash) return { ok: false, count: entries.length, brokenAt: e.seq, reason: "entry content doesn't match its fingerprint (it was edited)" };
    if (i > 0 && entries[i - 1].type !== "checkpoint" && e.seq !== entries[i - 1].seq + 1) return { ok: false, count: entries.length, brokenAt: e.seq, reason: "sequence numbers skip" };
    prevHash = e.hash;
  }
  return { ok: true, count: entries.length, brokenAt: null, reason: "" };
}

// Every outbound request goes through here: it refuses any host that isn't allowed and
// records what left, how big it was, and a fingerprint of it.
function makeClosedFetch(ledger, { allowed = ALLOWED_HOSTS, baseFetch = (...a) => fetch(...a), selfOrigin = null } = {}) {
  return async function closedFetch(url, init = {}, purpose = "") {
    const u = new URL(url, selfOrigin || "http://localhost");
    const local = selfOrigin && u.origin === selfOrigin;
    if (!local && !allowed.includes(u.hostname)) {
      await ledger.append("network.blocked", { host: u.hostname, purpose });
      throw Object.assign(new Error(`Blocked: O.T.T.E.R. only talks to ${allowed.join(", ")}. Nothing was sent to ${u.hostname}.`), { code: "blocked_host" });
    }
    const body = typeof init.body === "string" ? init.body : "";
    const images = (body.match(/"type":"image"/g) || []).length;
    const sent = await ledger.append(local ? "network.local" : "network.out", { host: u.hostname, path: u.pathname, purpose, bytes: body.length, images, fingerprint: body ? (await sha256(body)).slice(0, 16) : "" });
    const res = await baseFetch(url, init);
    return Object.assign(res, { ledgerSeq: sent.seq });
  };
}

// ---- core/spotter.js ----
// The spotter: O.T.T.E.R. as an advisor that notices what Dr. Prevot hasn't yet. It looks
// only at what he has already given it (pasted emails and documents, tasks, proposals) and
// runs locally for 0 tokens. It never reaches into BMCC systems and never acts; it points
// things out, with the evidence, and he decides.

const SPOT_STOP = new Set("the and for you your can could would will with that this from have has are was were what when where which who how does did about please just also into than then them they their there our out any all not but get got let may might should shall need make sure send sent".split(" "));
const spotKeywords = (t) => new Set((String(t).toLowerCase().match(/[a-z][a-z0-9-]{2,}/g) || []).filter((w) => !SPOT_STOP.has(w)));

const MONTH_ABBR = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];

// "October 20", "Oct. 20, 2026", "10/20", "2026-10-20" -> Date (local), or null. Without a year,
// the next occurrence on or after the reference date's month is assumed.
function parseLooseDate(s, ref = new Date()) {
  const t = String(s || "").trim().toLowerCase();
  let m;
  if ((m = t.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return new Date(+m[1], +m[2] - 1, +m[3]);
  let month, day, year = null;
  if ((m = t.match(/^([a-z]{3})[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(\d{4}))?$/))) { month = MONTH_ABBR.indexOf(m[1]); day = +m[2]; year = m[3] ? +m[3] : null; }
  else if ((m = t.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/))) { month = +m[1] - 1; day = +m[2]; year = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : null; }
  else return null;
  if (month < 0 || month > 11 || !day || day > 31) return null;
  if (year == null) {
    year = ref.getFullYear();
    if (month < ref.getMonth() - 2) year++; // "January 10" said in October means next January
  }
  return new Date(year, month, day);
}

const dayMs = 86400000;
const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();

function spot({ sources = [], tasks = [], proposals = [], me = [], now = new Date() } = {}) {
  const out = [];
  const today = startOfDay(now);
  const emails = sources.filter((s) => s.kind === "email");
  for (const s of emails) {
    const a = analyzeEmail(s.text, { me });
    for (const d of a.deadlines.filter((x) => x.basis === "explicit")) {
      const when = parseLooseDate(d.date, now);
      if (!when) continue;
      const days = Math.round((startOfDay(when) - today) / dayMs);
      if (days < 0 && days >= -14) out.push({ key: `late:${s.id}:${d.date}`, kind: "deadline", urgency: "high", title: `A deadline in "${s.title}" has passed (${d.date})`, detail: `${-days} day${days === -1 ? "" : "s"} ago. Check whether it was met.`, evidence: d.quote, sourceId: s.id });
      else if (days >= 0 && days <= 7) out.push({ key: `soon:${s.id}:${d.date}`, kind: "deadline", urgency: days <= 2 ? "high" : "medium", title: `Deadline ${days === 0 ? "today" : days === 1 ? "tomorrow" : `in ${days} days`}: ${d.date}`, detail: `From "${s.title}", ${d.from}.`, evidence: d.quote, sourceId: s.id });
    }
    // A question counts as answered only if a later message from you shares its key words;
    // replying to the thread about something else doesn't answer it.
    const msgs = parseThread(s.text);
    const isMe = (from) => me.some((n) => from.toLowerCase().includes(n.toLowerCase()));
    const unanswered = a.questions.filter((x) => {
      if (isMe(x.from)) return false;
      const kw = spotKeywords(x.quote);
      const later = msgs.slice(x.messageIndex + 1).filter((m) => isMe(m.from));
      return !later.some((m) => [...spotKeywords(m.body)].some((w) => kw.has(w)));
    });
    for (const q of unanswered)
      out.push({ key: `q:${s.id}:${q.quote.slice(0, 40)}`, kind: "unanswered", urgency: "medium", title: `${q.from.replace(/<.*>/, "").trim()} asked something that may still need your answer`, detail: `In "${s.title}".`, evidence: q.quote, sourceId: s.id });
    for (const c of a.othersCommitments)
      out.push({ key: `owed:${s.id}:${c.quote.slice(0, 40)}`, kind: "owed", urgency: "low", title: `${c.from.replace(/<.*>/, "").trim()} committed to something; worth tracking`, detail: `In "${s.title}".`, evidence: c.quote, sourceId: s.id });
    for (const c of a.myCommitments)
      out.push({ key: `mine:${s.id}:${c.quote.slice(0, 40)}`, kind: "mine", urgency: "medium", title: "You committed to something in this thread", detail: `In "${s.title}". Make sure it's on your list.`, evidence: c.quote, sourceId: s.id });
  }
  if (sources.length >= 1)
    for (const d of findDiscrepancies(sources))
      out.push({ key: `disc:${d.key}`, kind: "discrepancy", urgency: d.confidence === "high" ? "high" : "medium", title: "Numbers that don't agree", detail: d.finding, evidence: d.evidence[0]?.quote || "", sourceId: d.evidence[0]?.sourceId });
  for (const p of proposals.filter((x) => x.status === "pending" && now - x.createdAt > 2 * dayMs))
    out.push({ key: `stale:${p.id}`, kind: "waiting", urgency: "low", title: `"${p.label}" has waited ${Math.floor((now - p.createdAt) / dayMs)} days for your decision`, detail: `Target: ${p.target}.`, evidence: "" });
  for (const t of tasks.filter((x) => !x.done && now - x.createdAt > 7 * dayMs))
    out.push({ key: `task:${t.id}`, kind: "task", urgency: "low", title: `Open task for over a week: ${t.title}`, detail: "Do it, delegate it, or drop it.", evidence: "" });
  const rank = { high: 0, medium: 1, low: 2 };
  const seen = new Set();
  return out.filter((x) => (seen.has(x.key) ? false : seen.add(x.key))).sort((a, b) => rank[a.urgency] - rank[b.urgency]);
}

function spottedMarkdown(items, { max = 6 } = {}) {
  if (!items.length) return "Nothing new stands out in what you've given me. That covers deadlines, open questions, commitments and numbers in your attached emails and documents, plus your task list and waiting approvals.";
  const lines = items.slice(0, max).map((x) => `- **${x.title}** ${x.detail}${x.evidence ? `\n  _“${x.evidence.slice(0, 180)}”_` : ""}`);
  return `:::spotted\n${lines.join("\n")}${items.length > max ? `\n- …and ${items.length - max} more.` : ""}\n:::\nI only looked at what you've given me here (0 tokens). I haven't acted on any of it; it's your call.`;
}

const DRAFT_TYPES = new Set(["send_email", "reply_email", "forward_email", "post_content", "edit_document"]);

function activityForTool(name, input = {}) {
  switch (name) {
    case "search_knowledge": return "researching";
    case "analyze_email": return "reading_email";
    case "find_discrepancies": return "analyzing";
    case "get_skill": return "thinking";
    case "record_finding":
      return { discrepancy: "discrepancy", opportunity: "opportunity", conflicting_evidence: "conflict" }[input.kind] || "analyzing";
    case "propose_action": return DRAFT_TYPES.has(input.type) ? "drafting" : "awaiting_approval";
    case "web_search": return "researching";
    default: return "thinking";
  }
}

// Tool definitions shared by every transport. Each execute() is the only code the model can
// trigger; none of them can approve or execute an action.
function buildTools(ctx) {
  const actionTypes = Object.keys(ACTION_TYPES);
  const sourceById = (id) => ctx.sources.find((s) => s.id === String(id));
  return [
    {
      name: "search_knowledge",
      description: "Search O.T.T.E.R.'s local knowledge base (facts, decisions, projects Dr. Prevot approved for storage). Returns entries with provenance and dates.",
      inputSchema: { type: "object", properties: { query: { type: "string" } }, required: ["query"] },
      execute: async ({ query }) => searchKnowledge(ctx.knowledge, String(query || "")).map((k) => ({ id: k.id, title: k.title, text: k.text.slice(0, 1200), provenance: k.provenance, recorded: new Date(k.updatedAt || k.createdAt).toISOString().slice(0, 10), expired: !!(k.expiresAt && k.expiresAt < Date.now()) })),
    },
    {
      name: "analyze_email",
      description: "Run the deterministic email-thread parser on an attached email source. Returns messages, explicit vs inferred deadlines, action items, commitments by Dr. Prevot and by others, questions that may be unanswered, and conflicting figures. Quotes are verbatim.",
      inputSchema: { type: "object", properties: { source_id: { type: "string" } }, required: ["source_id"] },
      execute: async ({ source_id }) => {
        const s = sourceById(source_id);
        if (!s) throw new Error(`No attached source ${source_id}.`);
        return analyzeEmail(s.text, { me: ctx.settings.myNames });
      },
    },
    {
      name: "find_discrepancies",
      description: "Compare figures (dollar amounts, counts of students, hours, FTE, staff) across attached sources and check stated totals against line items. Returns candidate discrepancies with verbatim evidence; they are candidates, not verdicts.",
      inputSchema: { type: "object", properties: { source_ids: { type: "array", items: { type: "string" } } }, required: ["source_ids"] },
      execute: async ({ source_ids }) => {
        const docs = (Array.isArray(source_ids) ? source_ids : []).map(sourceById).filter(Boolean);
        if (!docs.length) throw new Error("None of those source ids are attached.");
        return findDiscrepancies(docs);
      },
    },
    {
      name: "get_skill",
      description: "Look up one of Dr. Prevot's discovered Claude skills: purpose, systems it needs, sensitivity, and whether it can run here, must be handed off, or is blocked. In local-server mode, returns its instructions when it is runnable.",
      inputSchema: { type: "object", properties: { name: { type: "string" } }, required: ["name"] },
      execute: async ({ name }) => {
        const skill = ctx.registry.find((s) => s.name === String(name));
        if (!skill) throw new Error(`No discovered skill named ${name}.`);
        const st = skillStatus(skill, { permissions: ctx.permissions, settings: ctx.settings });
        const out = { name: skill.name, description: skill.description, summary: skill.summary, systems: skill.systems, sensitivity: skill.sensitivity, ...st };
        if (st.runnable && ctx.getSkillInstructions) {
          const text = await ctx.getSkillInstructions(skill.name);
          if (text) out.instructions = "<untrusted_content kind=\"skill\">\n" + text.slice(0, 12000) + "\n</untrusted_content>";
        }
        ctx.usedSkills?.add(skill.name);
        return out;
      },
    },
    {
      name: "check_capability",
      description: "Check whether O.T.T.E.R. can do something right now (send email, read Outlook, calendar, listen, speak, computer volume, web research, Chrome forms, files, student records, sync). Returns status, why not, the missing piece, and what it would unlock.",
      inputSchema: { type: "object", properties: { need: { type: "string" } }, required: ["need"] },
      execute: async ({ need }) => {
        const hits = matchCapabilities(String(need || ""), ctx.capabilities || []);
        return hits.length ? hits : (ctx.capabilities || []).map(({ id, name, status }) => ({ id, name, status }));
      },
    },
    ...(ctx.snapshot ? [{
      name: "point_at",
      description: "Circle a spot on the attached screen snapshot so Dr. Prevot can find it. x and y are fractions of the image (0-1 from the left and from the top). label says what it is. This only draws on O.T.T.E.R.'s copy of the picture; it clicks nothing.",
      inputSchema: { type: "object", properties: { x: { type: "number" }, y: { type: "number" }, label: { type: "string" } }, required: ["x", "y", "label"] },
      execute: async ({ x, y, label }) => {
        const nx = Number(x), ny = Number(y);
        if (!(nx >= 0 && nx <= 1 && ny >= 0 && ny <= 1)) throw new Error("x and y must be fractions between 0 and 1.");
        ctx.addPointer?.({ x: nx, y: ny, label: String(label || "").slice(0, 80) });
        return { shown: true, note: "Circled on the snapshot in O.T.T.E.R.'s window. Nothing was clicked." };
      },
    }] : []),
    {
      name: "record_finding",
      description: "Record a finding on the executive dashboard. kind is one of discrepancy, opportunity, risk, action_item, commitment, decision, research, conflicting_evidence. evidence must quote attached sources verbatim ({source_id, quote}) or, for research, cite URLs returned by web_search in this conversation ({url, quote}). Unverifiable evidence is rejected.",
      inputSchema: {
        type: "object",
        properties: {
          kind: { type: "string" },
          title: { type: "string" },
          finding: { type: "string" },
          evidence: { type: "array", items: { type: "object", properties: { source_id: { type: "string" }, url: { type: "string" }, quote: { type: "string" } } } },
          confidence: { type: "string", enum: ["high", "medium", "low"] },
          impact: { type: "string" },
          possible_explanations: { type: "string" },
          recommendation: { type: "string" },
          next_step: { type: "string" },
          deadline: { type: "string" },
          deadline_basis: { type: "string", enum: ["explicit", "inferred"] },
        },
        required: ["kind", "title", "finding", "evidence", "confidence"],
      },
      execute: async (input) => {
        const ev = Array.isArray(input.evidence) ? input.evidence : [];
        const docEv = ev.filter((e) => e.source_id).map((e) => ({ sourceId: String(e.source_id), quote: String(e.quote || "") }));
        const webEv = ev.filter((e) => e.url && !e.source_id);
        const doc = verifyEvidence(docEv, ctx.sources);
        const webOk = webEv.every((e) => ctx.citations?.has(String(e.url)));
        if (!ev.length || (docEv.length && !doc.ok) || !webOk) {
          const bad = doc.results.filter((r) => !r.verified).map((r) => `${r.sourceId}: ${r.why}`);
          if (!webOk) bad.push("a URL was not returned by web_search in this conversation");
          if (!ev.length) bad.push("no evidence given");
          throw new Error("Rejected, not recorded: " + bad.join("; ") + ". Quote the source exactly or say the evidence is missing.");
        }
        const f = {
          kind: String(input.kind), title: String(input.title), finding: String(input.finding),
          evidence: [...doc.results.map((r) => ({ sourceId: r.sourceId, quote: r.quote })), ...webEv.map((e) => ({ url: String(e.url), quote: String(e.quote || ""), title: ctx.citations.get(String(e.url))?.title || "" }))],
          confidence: ["high", "medium", "low"].includes(input.confidence) ? input.confidence : "low",
          impact: input.impact || "", explanations: input.possible_explanations || "", recommendation: input.recommendation || "", nextStep: input.next_step || "",
          deadline: input.deadline || "", deadlineBasis: input.deadline_basis || "",
        };
        const saved = ctx.addFinding(f);
        return { recorded: true, id: saved.id };
      },
    },
    {
      name: "propose_action",
      description: "Queue an action for Dr. Prevot's approval. This does NOT perform it. Types: " + actionTypes.join(", ") + ". target is the recipient, system or skill; content is the exact text or data; consequences states risks and effects.",
      inputSchema: {
        type: "object",
        properties: { type: { type: "string", enum: actionTypes }, target: { type: "string" }, content: { type: "string" }, consequences: { type: "string" } },
        required: ["type", "target", "content", "consequences"],
      },
      execute: async (input) => {
        let content = String(input.content || "");
        if (input.type === "skill_handoff") content = handoffBrief(String(input.target), ctx.request, content);
        try {
          const p = await ctx.gate.propose({ type: String(input.type), target: String(input.target || ""), content, consequences: String(input.consequences || ""), origin: "assistant", untrustedContext: ctx.untrusted, skill: input.type === "skill_handoff" ? String(input.target) : null });
          ctx.onProposal?.(p);
          return { queued: true, id: p.id, status: "pending", note: "NOT executed. It is waiting for Dr. Prevot's approval in the approval panel." };
        } catch (e) {
          if (e instanceof SecurityError) throw new Error(e.message);
          throw e;
        }
      },
    },
  ];
}

// Applies the privacy policy to everything that would leave the device for `service`.
function prepareOutbound({ userText, history, sources, settings, service }) {
  const pieces = [userText, ...history.map((h) => h.content), ...sources.map((s) => s.text)];
  const verdicts = pieces.map((p) => evaluateOutbound(p, service, settings));
  const worst = verdicts.find((v) => v.decision === "block") || verdicts.find((v) => v.decision === "redact") || verdicts[0];
  if (worst.decision === "block") return { blocked: true, reason: worst.reason, findings: worst.findings };
  const clean = (t) => (settings.allowContactDetails ? redact(t, undefined, { categories: ["dob", "student_id"] }) : redact(t));
  return {
    blocked: false,
    redacted: worst.decision === "redact",
    reason: worst.reason || "",
    userText: clean(userText),
    history: history.map((h) => ({ role: h.role, content: clean(h.content) })),
    sources: sources.map((s) => ({ ...s, text: clean(s.text) })),
  };
}

async function runTurn({ transport, ctx, userText, history, onText = () => {}, signal, route = null }) {
  const service = transport.service;
  const plan = planRequest(userText, ctx.registry, { permissions: ctx.permissions, settings: ctx.settings });
  ctx.onPlan?.(plan);
  if (transport.kind === "offline") return offlineAnswer({ ctx, userText, plan });

  ctx.permissions.require(service, "read");
  const inc = route?.include || {};
  const keptHistory = inc.historyTurns ? history.slice(-inc.historyTurns) : history;
  const keptSources = route && !inc.sources ? [] : ctx.rawSources;
  const out = prepareOutbound({ userText, history: keptHistory, sources: keptSources, settings: ctx.settings, service });
  if (out.blocked) return { blocked: true, privacy: out, plan, text: "" };
  ctx.sources = out.sources;
  ctx.untrusted = ctx.sources.length > 0 || detectInjection(userText).length > 0;
  ctx.request = userText;
  ctx.citations = new Map();
  // Stored knowledge and project notes leave the device too, so they get the same redaction.
  const knowledgeHits = searchKnowledge((ctx.knowledge || []).filter((k) => !k.tags?.includes("profile") && !k.tags?.includes("learned")), userText, inc.knowledge ?? 5).map((k) => ({ ...k, text: redact(k.text) }));
  const projects = (ctx.projects || []).map((p) => ({ ...p, notes: redact(p.notes || "") }));
  const system = buildSystemPrompt({ settings: ctx.settings, plan, sources: ctx.sources, knowledgeHits, mode: transport.kind, permissions: ctx.permissions, today: new Date().toISOString().slice(0, 10), projects, capabilities: ctx.capabilities || [], route, profile: redact(profileText(ctx.knowledge || [])), snapshot: ctx.snapshot ? { width: ctx.snapshot.width, height: ctx.snapshot.height } : null });
  const tools = buildTools(ctx).filter((t) => !inc.tools || inc.tools.includes(t.name)).map((t) => ({
    ...t,
    execute: async (input, toolCtx) => {
      ctx.onActivity?.(activityForTool(t.name, input || {}), t.name);
      return t.execute(input || {}, toolCtx);
    },
  }));
  const canSeeImages = transport.kind === "server" || transport.kind === "direct";
  const last = ctx.snapshot && canSeeImages
    ? [{ type: "image", source: { type: "base64", media_type: ctx.snapshot.mediaType, data: ctx.snapshot.data } }, { type: "text", text: out.userText }]
    : out.userText;
  if (ctx.snapshot && canSeeImages) ctx.onImageSent?.(ctx.snapshot);
  const turns = [...out.history, { role: "user", content: last }];
  const res = await transport.run({ system, turns, tools, onText, signal, ctx, route });
  return { ...res, plan, privacy: out, citations: [...ctx.citations.entries()].map(([url, v]) => ({ url, ...v })) };
}

// ---------- transports ----------
function artifactTransport(sample) {
  return {
    kind: "artifact",
    service: "claude_ai",
    async run({ system, turns, tools, onText, signal, route }) {
      const input = [{ role: "user", content: system + "\n\nAcknowledge with OK, then follow these rules for the rest of the conversation." }, { role: "assistant", content: "OK." }, ...turns];
      const { text, truncated } = await sample(input, { tools: tools.map(({ name, description, inputSchema, execute }) => ({ name, description, inputSchema, execute })), onText: ({ text }) => onText(text), signal, ...(route?.modelTier ? { modelTier: route.modelTier } : {}) });
      // The claude.ai runtime does not report token counts; the router's estimate stands.
      return { text, truncated, usage: null };
    },
  };
}

// The Messages API loop shared by the local-server and direct transports: send, run any tool
// calls Claude makes, send the results back, repeat until Claude is done.
async function runLoop({ system, turns, tools, onText, signal, ctx, route }, call) {
  const messages = turns.map((t) => ({ role: t.role, content: t.content }));
  const usage = { input_tokens: 0, output_tokens: 0, rounds: 0, web_searches: 0 };
  const toolDefs = tools.map((t) => ({ name: t.name, description: t.description, input_schema: t.inputSchema }));
  const byName = new Map(tools.map((t) => [t.name, t]));
  const webSearch = ctx.permissions.check("web_research", "read") && (!route || !!route.include?.web);
  const texts = [];
  for (let round = 0; round < 12; round++) {
    const { ok, status, msg } = await call({ system, messages, tools: toolDefs, webSearch, effort: route?.effort, model: route?.model }, signal);
    if (!ok || msg.error) throw Object.assign(new Error(msg.error?.message || msg.error || `Error ${status}`), { code: msg.code || codeForStatus(status), usage });
    if (msg.usage) {
      usage.rounds++;
      usage.input_tokens += msg.usage.input_tokens || 0;
      usage.output_tokens += msg.usage.output_tokens || 0;
      usage.web_searches += msg.usage.server_tool_use?.web_search_requests || 0;
    }
    for (const b of msg.content || []) {
      if (b.type === "text") {
        texts.push(b.text);
        for (const c of b.citations || []) if (c.url) ctx.citations.set(c.url, { title: c.title || c.url, cited: c.cited_text || "" });
      }
      if (b.type === "server_tool_use") ctx.onActivity?.("researching", "web_search");
      if (b.type === "web_search_tool_result" && Array.isArray(b.content))
        for (const w of b.content) if (w.url) ctx.citations.set(w.url, { title: w.title || w.url, pageAge: w.page_age || "", ...(ctx.citations.get(w.url) || {}) });
    }
    onText(texts.join(""));
    messages.push({ role: "assistant", content: msg.content });
    if (msg.stop_reason === "refusal") { texts.push("\n\n_Claude declined this request._"); break; }
    if (msg.stop_reason === "pause_turn") continue;
    if (msg.stop_reason !== "tool_use") break;
    const uses = msg.content.filter((b) => b.type === "tool_use");
    const results = await Promise.all(uses.map(async (u) => {
      const tool = byName.get(u.name);
      try {
        if (!tool) throw new Error(`Unknown tool ${u.name}. Only the listed tools exist.`);
        const res = await tool.execute(u.input);
        return { type: "tool_result", tool_use_id: u.id, content: JSON.stringify(res).slice(0, 30000) };
      } catch (e) {
        return { type: "tool_result", tool_use_id: u.id, content: "Error: " + e.message, is_error: true };
      }
    }));
    messages.push({ role: "user", content: results });
  }
  return { text: texts.join(""), usage };
}

function codeForStatus(s) {
  return { 401: "auth", 403: "auth", 413: "prompt_too_large", 422: "privacy_block", 429: "rate_limited", 529: "rate_limited" }[s] || "upstream_error";
}

function serverTransport({ token, base = "" }) {
  return {
    kind: "server",
    service: "anthropic_api",
    run: (args) => runLoop(args, async (body, signal) => {
      const r = await fetch(base + "/api/messages", { method: "POST", headers: { "content-type": "application/json", "x-otter-token": token }, body: JSON.stringify(body), signal });
      const msg = await r.json().catch(() => ({ error: "Bad response from the local server." }));
      return { ok: r.ok, status: r.status, msg };
    }),
  };
}

// No server, nothing installed: the page calls the Claude API itself with a key kept only in
// this browser. Every request goes through closedFetch, which refuses any other host and
// writes the call to the verifiable ledger.
const DIRECT_MODEL = "claude-opus-5-5";
function directBody({ system, messages, tools, webSearch, effort, model }) {
  const toolList = [...tools];
  if (webSearch) toolList.push({ type: "web_search_20260209", name: "web_search", max_uses: 6 });
  return {
    model: model || DIRECT_MODEL,
    max_tokens: effort === "low" ? 4000 : 16000,
    thinking: { type: "adaptive" },
    output_config: { effort: ["low", "medium", "high"].includes(effort) ? effort : "medium" },
    system,
    messages,
    ...(toolList.length ? { tools: toolList } : {}),
  };
}
function directTransport({ apiKey, closedFetch }) {
  return {
    kind: "direct",
    service: "anthropic_api",
    run: (args) => runLoop(args, async (body, signal) => {
      const r = await closedFetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "content-type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify(directBody(body)),
        signal,
      }, "Claude answer");
      const msg = await r.json().catch(() => ({ error: { message: "The Claude API sent an unreadable response." } }));
      if (!r.ok) {
        const m = msg.error?.message || `HTTP ${r.status}`;
        return { ok: false, status: r.status, msg: { error: r.status === 401 ? "The API key was rejected. Check it in Settings." : r.status === 429 ? "Rate limited or out of credit on your Anthropic account. Try again shortly." : "The Claude API refused the request: " + m } };
      }
      return { ok: true, status: r.status, msg };
    }),
  };
}

const offlineTransport = { kind: "offline", service: null };

// No model connected: answer from the deterministic engines only, and say so.
function offlineAnswer({ ctx, userText, plan }) {
  const parts = [`:::understood\nI matched your request to ${plan.intents.length ? plan.intents.map((i) => i.replace(/_/g, " ")).join(", ") : "no specific task type"} by keywords only, because no AI is connected to interpret it.\n:::`, "**No AI engine is connected**, so this answer comes from O.T.T.E.R.'s built-in analyzers only (0 tokens). Connect Claude in Settings > Engine for full answers."];
  if (plan.steps.length) parts.push("**Skill plan for this request**\n" + planSummary(plan));
  for (const c of matchCapabilities(userText, ctx.capabilities || [])) parts.push(explain(c));
  const emails = ctx.rawSources.filter((s) => s.kind === "email");
  if (emails.length && /email|thread|deadline|action|commit|reply|inbox|summar/i.test(userText)) {
    for (const s of emails) {
      const a = analyzeEmail(s.text, { me: ctx.settings.myNames });
      const list = (arr, f) => (arr.length ? arr.map(f).join("\n") : "- none found");
      parts.push(`**${s.id} ${s.title}**: ${a.messages.length} message(s)\n\n**Deadlines**\n${list(a.deadlines, (d) => `- ${d.date} (${d.basis}): "${d.quote}"`)}\n\n**Asked of you**\n${list(a.actionItems, (d) => `- ${d.from}: "${d.quote}"`)}\n\n**Your commitments**\n${list(a.myCommitments, (d) => `- "${d.quote}"`)}\n\n**Others' commitments**\n${list(a.othersCommitments, (d) => `- ${d.from}: "${d.quote}"`)}\n\n**Questions possibly unanswered**\n${list(a.questions.filter((q) => q.possiblyUnanswered), (d) => `- ${d.from}: "${d.quote}"`)}`);
    }
  }
  if (ctx.rawSources.length >= 1 && /discrepanc|inconsisten|conflict|add up|match|compare|check/i.test(userText)) {
    const d = findDiscrepancies(ctx.rawSources);
    parts.push(d.length ? "**Discrepancy candidates**\n" + d.map((x) => `:::discrepancy\n**Finding:** ${x.finding}\n\n**Evidence:**\n${x.evidence.map((e) => `- ${e.sourceTitle}: "${e.quote}"`).join("\n")}\n\n**Confidence:** ${x.confidence}\n\n**Possible explanations:** ${x.possibleExplanations.join(" ")}\n:::`).join("\n\n") : "**Discrepancy check**: no conflicting figures found in the attached sources. That covers dollar amounts and counts only.");
  }
  if (parts.length === 2 + (plan.steps.length ? 1 : 0)) parts.push("Attach an email or document with **Add source**, then ask me to summarize it or check it for discrepancies.");
  return { text: parts.join("\n\n"), plan, offline: true, citations: [] };
}

// ---- public/markdown.js ----
// Small Markdown renderer for model output. It escapes all HTML first, so nothing in a
// reply (or in an email quoted inside a reply) can become live markup. Links are kept only
// for http(s) URLs.

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

const CALLOUT_LABELS = {
  finding: "Finding", recommendation: "Recommendation", discrepancy: "Discrepancy", opportunity: "Opportunity",
  draft: "Draft (not sent)", question: "Question for you", risk: "Risk", action: "Proposed action",
  limitation: "What I can't do yet", suggestion: "Suggestion to grow O.T.T.E.R.",
  understood: "What I understood", better: "Make this better", spotted: "Spotted for you",
};

function inline(s) {
  // s is already escaped
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => (codes.push(c), `\u0000${codes.length - 1}\u0000`));
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`);
  s = s.replace(/\[([^\]]+)\]\(([^)]*)\)/g, "$1"); // any other link scheme: text only
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:])/g, (_, pre, u) => `${pre}<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^_\w])_([^_\n]+)_(?!\w)/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[+i]}</code>`);
}

function table(rows) {
  const cells = (r) => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map((c) => c.trim());
  const head = cells(rows[0]);
  const body = rows.slice(2).map(cells);
  return `<div class="table-wrap"><table><thead><tr>${head.map((h) => `<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

let taskN = 0; // checkbox ids stay unique within one rendered message
function renderMarkdown(src, { nested = false } = {}) {
  if (!nested) taskN = 0;
  const lines = esc(String(src || "").replace(/\r/g, "")).split("\n");
  const out = [];
  let i = 0;
  const para = [];
  const flush = () => {
    if (para.length) out.push(`<p>${inline(para.join(" "))}</p>`);
    para.length = 0;
  };
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^```(\w*)/))) {
      flush();
      const code = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++;
      out.push(`<pre><code>${code.join("\n")}</code></pre>`);
      continue;
    }
    if ((m = line.match(/^:::\s*(\w+)\s*$/))) {
      flush();
      const kind = m[1].toLowerCase();
      const inner = [];
      i++;
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) inner.push(lines[i++]);
      i++;
      const label = CALLOUT_LABELS[kind] || kind;
      // inner is escaped already; unescape once so the recursive call escapes it exactly once
      const raw = inner.join("\n").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");
      out.push(`<section class="callout callout-${esc(kind)}"><header>${esc(label)}</header>${renderMarkdown(raw, { nested: true })}</section>`);
      continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1])) {
      flush();
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      out.push(table(rows));
      continue;
    }
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
      flush();
      const level = Math.min(4, m[1].length + 2);
      out.push(`<h${level}>${inline(m[2])}</h${level}>`);
      i++;
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      flush();
      const ordered = /^\s*\d/.test(line);
      const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        let item = lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, "");
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) item += " " + lines[i++].trim();
        const task = item.match(/^\[( |x|X)\]\s+(.*)$/);
        if (task) { taskN++; items.push(`<li class="task"><label><input type="checkbox" data-task="${taskN}"${task[1] !== " " ? " checked" : ""}> <span>${inline(task[2])}</span></label></li>`); }
        else items.push(`<li>${inline(item)}</li>`);
      }
      const isTasks = items.some((x) => x.startsWith('<li class="task"'));
      out.push(ordered ? `<ol${isTasks ? ' class="tasks"' : ""}>${items.join("")}</ol>` : `<ul${isTasks ? ' class="tasks"' : ""}>${items.join("")}</ul>`);
      continue;
    }
    if (/^&gt;\s?/.test(line)) {
      flush();
      const q = [];
      while (i < lines.length && /^&gt;\s?/.test(lines[i])) q.push(lines[i++].replace(/^&gt;\s?/, ""));
      out.push(`<blockquote>${inline(q.join(" "))}</blockquote>`);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) {
      flush();
      out.push("<hr>");
      i++;
      continue;
    }
    if (!line.trim()) {
      flush();
      i++;
      continue;
    }
    para.push(line);
    i++;
  }
  flush();
  return out.join("\n");
}

// Activities shown while thinking. Discrepancy Alert and Permission Patrol are not in the
// random pool: they appear only when a real discrepancy or lock exists.
const THINKING_ACTIVITIES = ["floating", "inbox", "calculator", "map", "papers", "puzzle", "coffee", "briefing"];

function mountOtter(el) {
  el.innerHTML = SVG;
  let state = "idle";
  return {
    get state() { return state; },
    set(next, { activity } = {}) {
      state = STATES[next] ? next : "idle";
      const keep = [...el.classList].filter((c) => !c.startsWith("s-") && !c.startsWith("act-"));
      el.className = keep.join(" ");
      el.classList.add("s-" + state);
      if (state === "thinking") el.classList.add("act-" + (activity || THINKING_ACTIVITIES[Math.floor(Math.random() * THINKING_ACTIVITIES.length)]));
      el.setAttribute("aria-label", "O.T.T.E.R.: " + STATES[state]);
      return STATES[state];
    },
    glasses(on) { el.classList.toggle("glasses-on", !!on); },
  };
}

// ---- public/voice.js ----
// Voice: speaks answers with the most natural male voice the browser offers and listens
// through the browser's speech recognition. Both are browser features, so what is possible
// depends on the browser and on where the page runs; voiceEnv() reports it honestly.

const MALE = /\b(andrew|guy|christopher|eric|brian|davis|roger|steffan|tony|jason|ryan|thomas|william|liam|connor|evan|nathan|aaron|alex|daniel|tom|reed|oliver|arthur|david|mark|james|george|rishi|lee|male|matthew|justin|joey|stephen|gregory|kevin)\b/i;
const FEMALE = /\b(aria|jenny|michelle|emma|ava|samantha|zira|susan|hazel|libby|sonia|natasha|karen|moira|tessa|fiona|victoria|allison|serena|female|catherine|nancy|joanna|salli|kimberly|ivy|kendra|ana|jane|nicky|zoe|siri)\b/i;
const NOVELTY = /\b(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|rocko|grandpa|junior|ralph|fred|eddy|sandy|shelley|flo)\b/i;
const NATURAL = /natural|neural|enhanced|premium/i;

function vendorOf(v) {
  if (/microsoft/i.test(v.name)) return "Microsoft";
  if (/google/i.test(v.name)) return "Google";
  return "the browser maker";
}

function scoreVoice(v) {
  if (!/^en/i.test(v.lang) || NOVELTY.test(v.name) || FEMALE.test(v.name) || !MALE.test(v.name)) return -1;
  let s = 10;
  if (NATURAL.test(v.name)) s += 20;
  if (/^en[-_]US/i.test(v.lang)) s += 3;
  if (/david|alex/i.test(v.name)) s -= 2; // older voices
  return s;
}

// allowCloud=false keeps answer text on this device: only localService voices qualify.
function pickMaleVoice(voices, { allowCloud = false, preferred = "" } = {}) {
  const ranked = voices.map((v) => ({ v, s: scoreVoice(v) })).filter((x) => x.s >= 0).sort((a, b) => b.s - a.s);
  const local = ranked.filter((x) => x.v.localService);
  const cloud = ranked.filter((x) => !x.v.localService);
  const pool = allowCloud ? ranked : local;
  const pref = preferred && pool.find((x) => x.v.name === preferred);
  const best = pref || pool[0];
  return {
    voice: best?.v || null,
    natural: !!best && NATURAL.test(best.v.name),
    local: !!best?.v.localService,
    bestCloud: cloud[0]?.v || null,
    bestCloudNatural: !!cloud[0] && NATURAL.test(cloud[0].v.name),
    candidates: pool.map((x) => x.v),
  };
}

// Turns Markdown into something worth hearing: no symbols, tables, code or URLs.
function speakable(md, mode = "summary") {
  let t = String(md || "")
    .replace(/O\.T\.T\.E\.R\.?/g, "Otter")
    .replace(/```[\s\S]*?```/g, " ")
    .replace(/^\s*\|.*\|\s*$/gm, " ")
    .replace(/^:::\s*(\w+)\s*$/gm, (_, k) => ({ draft: "Draft.", limitation: "", suggestion: "Suggestion.", discrepancy: "Discrepancy.", recommendation: "Recommendation." }[k.toLowerCase()] ?? ""))
    .replace(/^:::\s*$/gm, "")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
    .replace(/https?:\/\/\S+/g, "")
    .replace(/[*_`#>]+/g, "")
    .replace(/^\s*[-•]\s+/gm, "")
    .replace(/\[REDACTED (\w+)\]/g, "a redacted $1")
    .replace(/\s+/g, " ")
    .trim();
  const sentences = t.match(/[^.!?]+[.!?]+["')]?|[^.!?]+$/g) || [];
  if (mode === "full") return sentences.map((s) => s.trim()).filter(Boolean);
  const out = [];
  let len = 0;
  for (const s of sentences) {
    if (out.length >= 3 || len + s.length > 480) break;
    out.push(s.trim());
    len += s.length;
  }
  if (out.length < sentences.length) out.push("The rest is on screen.");
  return out.filter(Boolean);
}

class Speaker {
  constructor({ getSettings, onStart, onEnd }) {
    this.synth = globalThis.speechSynthesis || null;
    this.getSettings = getSettings;
    this.onStart = onStart;
    this.onEnd = onEnd;
    this.voices = [];
    this.speaking = false;
    this._keepAlive = null;
    if (this.synth) {
      const load = () => (this.voices = this.synth.getVoices());
      load();
      this.synth.addEventListener?.("voiceschanged", load);
    }
  }
  get supported() { return !!this.synth; }
  choice() {
    const s = this.getSettings();
    return pickMaleVoice(this.voices, { allowCloud: s.allowCloudVoices, preferred: s.voiceName });
  }
  stop() {
    if (!this.synth) return;
    this.synth.cancel();
    clearInterval(this._keepAlive);
    if (this.speaking) { this.speaking = false; this.onEnd?.(true); }
  }
  // Speaks sentence by sentence with a short breath between, which sounds more natural and
  // avoids Chrome cutting off long utterances.
  speak(markdown, { mode } = {}) {
    if (!this.synth) return Promise.resolve(false);
    const s = this.getSettings();
    const { voice } = this.choice();
    const parts = speakable(markdown, mode || s.speakMode);
    if (!parts.length || s.voiceVolume <= 0) return Promise.resolve(false);
    this.synth.cancel();
    this.speaking = true;
    this.onStart?.();
    clearInterval(this._keepAlive);
    this._keepAlive = setInterval(() => { if (this.synth.speaking && !this.synth.paused) { this.synth.pause(); this.synth.resume(); } }, 10000);
    return new Promise((resolve) => {
      let i = 0;
      const next = () => {
        if (!this.speaking) return resolve(false);
        if (i >= parts.length) { this.speaking = false; clearInterval(this._keepAlive); this.onEnd?.(false); return resolve(true); }
        const u = new SpeechSynthesisUtterance(parts[i++]);
        if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-US";
        u.volume = Math.max(0, Math.min(1, s.voiceVolume));
        u.rate = s.voiceRate || 1;
        u.pitch = 0.95;
        u.onend = () => setTimeout(next, 140);
        u.onerror = () => { this.speaking = false; clearInterval(this._keepAlive); this.onEnd?.(true); resolve(false); };
        this.synth.speak(u);
      };
      next();
    });
  }
}

class Listener {
  constructor({ onFinal, onInterim, onState, onError, silenceMs = 1600 }) {
    const SR = globalThis.SpeechRecognition || globalThis.webkitSpeechRecognition;
    this.SR = SR;
    this.onFinal = onFinal;
    this.onInterim = onInterim;
    this.onState = onState;
    this.onError = onError;
    this.silenceMs = silenceMs;
    this.active = false;
    this.onDevice = false;
    this.noSpeech = 0;
  }
  get supported() { return !!this.SR; }
  // Chrome has an experimental on-device check (SpeechRecognition.available), but calling it
  // crashed the page in testing, so O.T.T.E.R. never calls it and assumes audio is sent to
  // the browser maker's speech service. That keeps the privacy notice on the cautious side.
  async checkOnDevice() {
    this.onDevice = false;
    return false;
  }
  start() {
    if (!this.SR || this.active) return false;
    const rec = new this.SR();
    this.rec = rec;
    rec.lang = "en-US";
    rec.continuous = true;
    rec.interimResults = true;
    let finalText = "";
    let timer = null;
    const finish = () => { clearTimeout(timer); try { rec.stop(); } catch {} };
    rec.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript + " ";
        else interim += e.results[i][0].transcript;
      }
      this.noSpeech = 0;
      this.onInterim?.((finalText + interim).trim());
      clearTimeout(timer);
      timer = setTimeout(finish, this.silenceMs);
    };
    rec.onerror = (e) => {
      if (e.error === "no-speech") this.noSpeech++;
      if (e.error !== "no-speech" && e.error !== "aborted") this.onError?.(e.error);
    };
    rec.onend = () => {
      clearTimeout(timer);
      this.active = false;
      this.onState?.(false);
      const text = finalText.trim();
      if (text) this.onFinal?.(text);
      else if (this.noSpeech >= 2) this.onError?.("idle");
      else this.onError?.("silence");
    };
    try {
      rec.start();
      this.active = true;
      this.onState?.(true);
      return true;
    } catch (e) {
      this.onError?.(e.message || "start-failed");
      return false;
    }
  }
  stop() {
    if (this.rec && this.active) { try { this.rec.abort(); } catch {} }
    this.active = false;
  }
}

// ---- public/screen.js ----
// Screen snapshots for coaching. Chrome asks you to pick a screen, window or tab and shows its
// own "sharing" bar the whole time. O.T.T.E.R. takes a still picture every 15 seconds, keeps
// only the latest one in memory (never on disk), and sends one to Claude only when you ask a
// question while it's looking. Stopping, sleeping or shutting off ends the capture entirely.

function fitSize(w, h, max = 1280) {
  if (!w || !h) return { width: 0, height: 0 };
  const k = Math.min(1, max / Math.max(w, h));
  return { width: Math.round(w * k), height: Math.round(h * k) };
}

// Average absolute difference of two equal-length grayscale thumbnails, 0 (same) to 1.
function diffScore(a, b) {
  if (!a || !b || a.length !== b.length || !a.length) return 1;
  let d = 0;
  for (let i = 0; i < a.length; i++) d += Math.abs(a[i] - b[i]);
  return d / (a.length * 255);
}

class ScreenWatcher {
  constructor({ onState = () => {}, onSnapshot = () => {}, intervalMs = 15000, maxWidth = 1280, getWindow = () => window } = {}) {
    this.onState = onState;
    this.onSnapshot = onSnapshot;
    this.intervalMs = intervalMs;
    this.maxWidth = maxWidth;
    this.getWindow = getWindow;
    this.active = false;
    this.latest = null;
    this.thumb = null;
  }
  get supported() { return !!this.getWindow().navigator.mediaDevices?.getDisplayMedia; }
  async start() {
    if (this.active) return true;
    const w = this.getWindow();
    this.stream = await w.navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 2 }, audio: false, selfBrowserSurface: "exclude", surfaceSwitching: "include" });
    const track = this.stream.getVideoTracks()[0];
    track.addEventListener("ended", () => this.stop("Chrome's Stop sharing button"));
    this.video = document.createElement("video");
    this.video.muted = true;
    this.video.playsInline = true;
    this.video.srcObject = this.stream;
    await this.video.play().catch(() => {});
    this.active = true;
    this.surface = track.getSettings?.().displaySurface || "screen";
    this.onState(true, this.surface);
    await this.capture();
    this.timer = setInterval(() => this.capture(), this.intervalMs);
    return true;
  }
  async capture() {
    if (!this.active || !this.video) return null;
    const v = this.video;
    if (!v.videoWidth) await new Promise((r) => setTimeout(r, 300));
    const { width, height } = fitSize(v.videoWidth, v.videoHeight, this.maxWidth);
    if (!width) return null;
    const c = document.createElement("canvas");
    c.width = width; c.height = height;
    const g = c.getContext("2d");
    g.drawImage(v, 0, 0, width, height);
    const url = c.toDataURL("image/jpeg", 0.72);
    // Tiny grayscale thumbnail to tell whether the screen changed since the last picture.
    const t = document.createElement("canvas");
    t.width = 32; t.height = 18;
    const tg = t.getContext("2d");
    tg.drawImage(c, 0, 0, 32, 18);
    const px = tg.getImageData(0, 0, 32, 18).data;
    const gray = new Uint8Array(32 * 18);
    for (let i = 0; i < gray.length; i++) gray[i] = (px[i * 4] + px[i * 4 + 1] + px[i * 4 + 2]) / 3;
    const changed = diffScore(this.thumb, gray);
    this.thumb = gray;
    this.latest = { url, data: url.split(",")[1], mediaType: "image/jpeg", width, height, at: Date.now(), changed };
    this.onSnapshot(this.latest);
    return this.latest;
  }
  stop(reason = "") {
    clearInterval(this.timer);
    this.stream?.getTracks().forEach((t) => t.stop());
    if (this.video) this.video.srcObject = null;
    const was = this.active;
    this.stream = null; this.video = null; this.latest = null; this.thumb = null; this.active = false;
    if (was) this.onState(false, reason);
  }
}

// Local persistence. Everything stays in this browser's storage on this device; nothing is
// written to an external database. Conversations older than the retention window are
// purged on load, and the whole store can be exported or wiped from Settings.


const KEY = "otter.v1";

const DEFAULT_SETTINGS = {
  approvedServices: [],
  allowContactDetails: false,
  ferpaAttested: false,
  ferpaBasis: "",
  ferpaApprover: "",
  myNames: ["Arnaud", "Prevot", "aprevot"],
  briefingFormat: "Bottom line first, then reasoning, then a short action list.",
  retentionDays: 90,
  glasses: true,
  reduceMotion: false,
  theme: "system",
  disabledSkills: [],
  onboarded: false,
  voiceOn: true,
  voiceVolume: 0.2,
  voiceRate: 1,
  voiceName: "",
  speakMode: "summary",
  conversationMode: true,
  systemVolumeAtLaunch: true,
  launchVolume: 20,
  voiceOnboarded: false,
  askAboveTokens: 15000,
  layout: "simple",
  viewMode: "mini",
  autoListen: true,
  wakeWord: true,
  openDefaultsApplied: false,
  closedMode: true,
  screenHold: true,
};

function blank() {
  return { version: 1, conversations: [], sources: {}, findings: [], proposals: [], audit: [], knowledge: [], projects: [], tasks: [], permissions: {}, settings: { ...DEFAULT_SETTINGS }, counters: { source: 0 }, usage: emptyUsage(), tokenLedger: {}, lastVerify: null };
}

class Store {
  constructor(storage) {
    this.storage = storage;
    this.data = blank();
    this.available = true;
    this._t = null;
  }
  load() {
    try {
      const raw = this.storage?.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        this.data = { ...blank(), ...parsed, settings: { ...DEFAULT_SETTINGS, ...(parsed.settings || {}) }, usage: { ...emptyUsage(), ...(parsed.usage || {}) } };
      }
    } catch {
      this.available = false;
    }
    this.purgeExpired();
    return this;
  }
  save() {
    clearTimeout(this._t);
    this._t = setTimeout(() => this.flush(), 150);
  }
  flush() {
    try {
      this.storage?.setItem(KEY, JSON.stringify(this.data));
      this.available = true;
    } catch {
      this.available = false;
    }
  }
  purgeExpired(now = Date.now()) {
    const days = +this.data.settings.retentionDays || 0;
    if (!days) return 0;
    const cutoff = now - days * 86400000;
    const before = this.data.conversations.length;
    const keep = this.data.conversations.filter((c) => c.pinned || c.updatedAt >= cutoff);
    const dropped = this.data.conversations.filter((c) => !keep.includes(c));
    for (const c of dropped) for (const sid of c.sourceIds || []) delete this.data.sources[sid];
    this.data.conversations = keep;
    return before - keep.length;
  }
  wipe() {
    this.data = blank();
    try { this.storage?.removeItem(KEY); } catch {}
  }
  exportJSON() {
    return JSON.stringify(this.data, null, 2);
  }
}

// ---- public/app.js ----
// O.T.T.E.R. application shell: wires the security core, the conversation engine, local
// storage and the interface together. The approval panel in this file is the only place
// that calls gate.approve() and gate.execute(), and only from a click.

// DOC is the document the interface lives in: the page, or the floating window when popped out.
let DOC = document;
const $ = (id) => DOC.getElementById(id);
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const fmtDate = (ts) => new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
const fmtTime = (ts) => new Date(ts).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });

// ---------- state ----------
let storage = null;
try { storage = window.localStorage; } catch { storage = null; }
const store = new Store(storage).load();
const D = store.data;
const audit = new AuditLog(D.audit, { redact: redactForLog });
D.audit = audit.entries;
audit.listeners.add(() => store.save());
const permissions = new PermissionRegistry(D.permissions, { audit });
// Verifiable ledger: hash-chained record of every session event and everything sent out.
const ledger = new Ledger(D.ledger || (D.ledger = []), { onChange: () => store.save() });

async function copyText(text, el) {

function openModal(node, { onClose } = {}) {

// ---------- engine ----------
async function detectEngine() {
  const token = document.querySelector('meta[name="otter-token"]')?.content;
  if (token) {
    try {
      const r = await fetch("/api/capabilities", { headers: { "x-otter-token": token } });
      if (r.ok) {
        const cap = await r.json();
        if (cap.apiKey) return { kind: "server", transport: serverTransport({ token }), label: `Claude API · ${cap.model}`, detail: "Local server on this computer with your API key. Web research available when you allow it.", cap, token };
        return { kind: "offline", transport: offlineTransport, label: "Built-in analyzers only", detail: "The local server is running without an ANTHROPIC_API_KEY. Set one and restart to enable Claude.", cap, token };
      }
    } catch {}
  }
  if (window.claude?.use) {
    const sample = await window.claude.use("sample").catch(() => null);
    if (sample) return { kind: "artifact", transport: artifactTransport(sample), label: "Claude via claude.ai", detail: "Uses your claude.ai account inside this private artifact. No web access in this mode." };
  }
  if (window.top === window) {
    const apiKey = readKey();
    if (apiKey) return { kind: "direct", transport: directTransport({ apiKey, closedFetch }), label: "Claude API · direct", detail: "This page talks only to api.anthropic.com with your key, stored in this browser. Nothing is installed.", cap: { model: "claude-opus-5-5" } };
    return { kind: "offline", needsKey: true, transport: offlineTransport, label: "Add your API key", detail: "Paste an Anthropic API key in Settings to connect Claude. Built-in guides and checkers work without it." };
  }
  return { kind: "offline", transport: offlineTransport, label: "Built-in analyzers only", detail: "No Claude connection found. Open the claude.ai link or run the local server with an API key." };
}

function serviceApproved() {

function approveService() {
  const s = service();

  permissions.grant(s, "read", { purpose: "Non-protected BMCC work content, confirmed by Dr. Prevot" });

  D.settings.approvedServices = D.settings.approvedServices.filter((x) => x !== s);
