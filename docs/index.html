<style>
/* Layout: three-pane command center. Narrow nav rail + history on the left, chat in the
   middle, dashboard drawer on the right. Palette: river water and wet stone, with otter-fur
   brown as the single warm accent. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #e9eeec;
  --line: #d4dcd9;
  --fg: #172328;
  --muted: #5a6a6f;
  --river: #24606b;
  --river-soft: #d8e9ea;
  --fur: #8a5530;
  --fur-soft: #f1e3d6;
  --ok: #2f7a4f;
  --ok-soft: #dcefe2;
  --warn: #9a6a00;
  --warn-soft: #f7ebcc;
  --bad: #b03a2e;
  --bad-soft: #f6dcd8;
  --otter-fur: #8a5530;
  --otter-fur-dark: #5e3a20;
  --otter-belly: #e9cfae;
  --otter-ink: #1b1410;
  --prop-paper: #fbfaf6;
  --prop-line: #3a4a50;
  --water: #7fb6c0;
  --shadow: 0 1px 2px rgb(23 35 40 / .06), 0 8px 24px rgb(23 35 40 / .08);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  --side-w: 264px;
  --dash-w: 360px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1719; --surface: #162125; --surface-2: #1d2a2f; --line: #2a3a40; --fg: #e3ebe9; --muted: #95a6aa;
    --river: #6fb3bd; --river-soft: #1d3a40; --fur: #d39a6a; --fur-soft: #3a2a1e;
    --ok: #6cc28f; --ok-soft: #1b3426; --warn: #e2b74e; --warn-soft: #3a3016; --bad: #ef8a7e; --bad-soft: #3e2220;
    --otter-belly: #dcc29f; --prop-paper: #e9e6dc; --prop-line: #2a3438; --water: #3f7f8a;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1719; --surface: #162125; --surface-2: #1d2a2f; --line: #2a3a40; --fg: #e3ebe9; --muted: #95a6aa;
  --river: #6fb3bd; --river-soft: #1d3a40; --fur: #d39a6a; --fur-soft: #3a2a1e;
  --ok: #6cc28f; --ok-soft: #1b3426; --warn: #e2b74e; --warn-soft: #3a3016; --bad: #ef8a7e; --bad-soft: #3e2220;
  --otter-belly: #dcc29f; --prop-paper: #e9e6dc; --prop-line: #2a3438; --water: #3f7f8a;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--river); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a { color: var(--river); }
code, .mono { font-family: var(--f-mono); font-size: .86em; }

.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr) auto; height: 100%; }
.app.side-collapsed { --side-w: 60px; }

/* ---------- sidebar ---------- */
.sidebar { display: flex; flex-direction: column; gap: 10px; min-height: 0; padding: 12px 10px; padding-left: max(10px, env(safe-area-inset-left, 0px)); background: var(--surface); border-right: 1px solid var(--line); }
.side-top { display: flex; align-items: center; gap: 8px; }
.brand { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.brand-mark { font: 700 19px/1 var(--f-display); letter-spacing: .04em; color: var(--fg); }
.brand-sub { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.side-new { justify-content: center; }
.side-search input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.side-nav { display: grid; gap: 2px; }
.nav-btn { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 0; border-radius: 8px; background: none; cursor: pointer; text-align: left; color: var(--muted); }
.nav-btn:hover { background: var(--surface-2); color: var(--fg); }
.nav-btn.active { background: var(--river-soft); color: var(--fg); font-weight: 600; }
.nav-btn .ico { width: 18px; text-align: center; }
.count { margin-left: auto; font: 600 11px/1 var(--f-mono); padding: 3px 6px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.count.warn { background: var(--warn-soft); color: var(--warn); }
.history-head { display: flex; align-items: center; justify-content: space-between; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 6px 0; }
.history-head select { border: 0; background: none; font-size: 11px; color: var(--muted); }
.history { flex: 1; min-height: 0; overflow-y: auto; display: grid; align-content: start; gap: 1px; padding-bottom: 12px; }
.hist-group { font-size: 11px; color: var(--muted); padding: 10px 8px 4px; font-weight: 600; }
.hist-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 7px; border: 0; background: none; text-align: left; cursor: pointer; width: 100%; min-width: 0; }
.hist-item:hover { background: var(--surface-2); }
.hist-item.active { background: var(--river-soft); }
.hist-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.hist-item .pin { color: var(--fur); font-size: 11px; }
.hist-more { height: 1px; }
.app.side-collapsed .lbl, .app.side-collapsed .brand, .app.side-collapsed .side-search, .app.side-collapsed .history, .app.side-collapsed .history-head, .app.side-collapsed .count { display: none; }

/* ---------- main ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); min-height: 76px; }
.title-wrap { flex: 1; min-width: 0; }
.conv-title { margin: 0; font: 600 18px/1.25 var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-wrap: balance; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; min-width: 0; }
.pill { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: var(--river-soft); color: var(--fg); border: 1px solid transparent; }
.pill.off { background: var(--warn-soft); color: var(--warn); }
.pill.pill-quiet { background: var(--surface-2); color: var(--muted); }
.top-actions { display: flex; gap: 6px; align-items: center; }
.avatar-wrap { display: flex; flex-direction: column; align-items: center; width: 92px; flex: none; }
.otter { width: 74px; height: 74px; }
.otter-caption { font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.2; min-height: 2.4em; max-width: 92px; }
.icon-btn.only-narrow { display: none; }
.icon-btn svg { width: 18px; height: 18px; }
.menu { position: absolute; right: 120px; top: 60px; z-index: 30; display: grid; min-width: 220px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.menu button { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.menu button:hover { background: var(--surface-2); }
.danger { color: var(--bad); }
.voice-pop { right: 150px; min-width: 280px; max-width: calc(100vw - 32px); gap: 10px; padding: 12px; }
.voice-pop input[type=range] { width: 100%; accent-color: var(--river); }
.vp-sys { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 6px; font-size: 13px; }
.vp-sys .btn { padding: 4px 10px; font-size: 13px; }
.mic.on { background: var(--bad-soft); color: var(--bad); animation: micpulse 1.4s ease-in-out infinite; }
@keyframes micpulse { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 4px var(--bad-soft); } }
.conv-banner { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; background: var(--river-soft); border: 1px solid var(--river); border-radius: 8px; padding: 6px 8px 6px 12px; margin-bottom: 6px; }
.conv-banner .cb-text { flex: 1 1 220px; }
.conv-banner .btn { padding: 4px 10px; font-size: 13px; }
.caps-table { min-width: 900px; }
.caps-table td { min-width: 150px; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--river); }
.btn-primary { background: var(--river); border-color: var(--river); color: var(--surface); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: none; }
.btn-ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn-bad { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border: 1px solid transparent; border-radius: 8px; background: none; cursor: pointer; font-size: 17px; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.link-btn { border: 0; background: none; color: var(--river); cursor: pointer; padding: 0; font-weight: 600; }

.view { display: none; flex: 1; min-height: 0; overflow-y: auto; }
.view.active { display: flex; flex-direction: column; }
#view-chat.view { overflow: hidden; }
.page { width: 100%; max-width: 1080px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; align-content: start; }
.page h2 { margin: 0; font: 700 22px/1.2 var(--f-display); text-wrap: balance; }
.page h3 { margin: 0 0 6px; font: 600 15px/1.3 var(--f-display); }
.lead { margin: 0; color: var(--muted); max-width: 70ch; }

/* ---------- chat ---------- */
.messages { flex: 1; min-height: 0; overflow-y: auto; padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 780px; width: 100%; margin: 0 auto; display: grid; gap: 6px; }
.msg-meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.msg-meta .who { font-weight: 700; color: var(--fg); letter-spacing: .02em; }
.msg-user .bubble { background: var(--river-soft); border-radius: 12px 12px 4px 12px; padding: 10px 14px; justify-self: end; max-width: 92%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-user .msg-meta { justify-content: flex-end; }
.msg-assistant .bubble { min-width: 0; overflow-wrap: anywhere; }
.bubble > :first-child { margin-top: 0; }
.bubble > :last-child { margin-bottom: 0; }
.bubble p { margin: .55em 0; }
.bubble h3, .bubble h4, .bubble h5, .bubble h6 { font-family: var(--f-display); margin: 1em 0 .3em; font-size: 16px; }
.bubble ul, .bubble ol { padding-left: 1.3em; margin: .4em 0; }
.bubble blockquote { margin: .6em 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--muted); }
.bubble pre { background: var(--surface-2); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
.table-wrap { overflow-x: auto; margin: .6em 0; }
.bubble table { border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.bubble th, .bubble td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.bubble th { background: var(--surface-2); }
.bubble.collapsed { max-height: 420px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.msg-tools { display: flex; gap: 12px; font-size: 12.5px; flex-wrap: wrap; }
.usage-line { font: 11.5px/1.4 var(--f-mono); color: var(--muted); }
.route-hint { font-family: var(--f-mono); color: var(--river); }
.callout-understood { border-left-color: var(--muted); background: var(--surface-2); } .callout-understood > header { color: var(--muted); }
.callout-better { border-left-color: var(--ok); } .callout-better > header { color: var(--ok); }
.msg-tools button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0; }
.msg-tools button:hover { color: var(--river); }
.callout { border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px; padding: 8px 12px; margin: .7em 0; background: var(--surface); }
.callout > header { font: 700 11px/1.4 var(--f-body); letter-spacing: .09em; text-transform: uppercase; margin-bottom: 2px; }
.callout-recommendation { border-left-color: var(--river); } .callout-recommendation > header { color: var(--river); }
.callout-finding, .callout-question { border-left-color: var(--muted); } .callout-finding > header, .callout-question > header { color: var(--muted); }
.callout-discrepancy, .callout-risk { border-left-color: var(--warn); background: var(--warn-soft); } .callout-discrepancy > header, .callout-risk > header { color: var(--warn); }
.callout-opportunity { border-left-color: var(--ok); background: var(--ok-soft); } .callout-opportunity > header { color: var(--ok); }
.callout-limitation { border-left-color: var(--fur); } .callout-limitation > header { color: var(--fur); }
.callout-suggestion { border-left-color: var(--river); background: var(--river-soft); } .callout-suggestion > header { color: var(--river); }
.callout ul { margin: .3em 0; }
.callout-draft { border-left-color: var(--fur); background: var(--fur-soft); border-style: dashed; border-left-style: solid; } .callout-draft > header { color: var(--fur); }
.plan { font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; }
.plan summary { cursor: pointer; }
.plan ul { margin: 6px 0 2px; padding-left: 1.1em; }
.mode { font: 600 10.5px/1 var(--f-mono); text-transform: uppercase; padding: 2px 5px; border-radius: 4px; background: var(--surface-2); }
.mode-analysis { background: var(--ok-soft); color: var(--ok); }
.mode-handoff { background: var(--river-soft); color: var(--river); }
.mode-blocked, .mode-missing { background: var(--bad-soft); color: var(--bad); }
.cites { font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 6px; }
.cites ol { margin: 4px 0 0; padding-left: 1.3em; }
.notice { border-radius: 8px; padding: 9px 12px; font-size: 13.5px; background: var(--warn-soft); color: var(--fg); border: 1px solid var(--warn); }
.notice.bad { background: var(--bad-soft); border-color: var(--bad); }
.notice.info { background: var(--river-soft); border-color: var(--river); }

.proposal { border: 1px solid var(--fur); border-radius: var(--r); padding: 10px 12px; background: var(--surface); display: grid; gap: 6px; }
.proposal .p-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.proposal .p-title { font-weight: 700; }
.status { font: 600 11px/1 var(--f-body); padding: 4px 8px; border-radius: 99px; letter-spacing: .02em; }
.status-pending, .status-approved { background: var(--warn-soft); color: var(--warn); }
.status-executed { background: var(--ok-soft); color: var(--ok); }
.status-rejected, .status-superseded { background: var(--surface-2); color: var(--muted); }
.status-not_executed, .status-failed { background: var(--bad-soft); color: var(--bad); }
.proposal .p-target { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }

.empty-chat { margin: auto; max-width: 620px; text-align: left; display: grid; gap: 14px; padding: 20px 0; }
.empty-chat h2 { margin: 0; font: 700 26px/1.15 var(--f-display); text-wrap: balance; }
.starter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
.starter { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; cursor: pointer; font-size: 13.5px; }
.starter:hover { border-color: var(--river); }
.starter b { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--river); margin-bottom: 2px; }

.composer { padding: 8px 16px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
.composer > * { max-width: 780px; margin-left: auto; margin-right: auto; }
.composer-box { display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 6px; background: var(--bg); }
.composer-box:focus-within { border-color: var(--river); }
#input { flex: 1; min-width: 0; resize: none; border: 0; background: none; padding: 7px 4px; max-height: 240px; line-height: 1.5; outline: none; }
.composer-note { font-size: 11.5px; color: var(--muted); margin: 6px auto 0; }
.source-tray { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.source-tray:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 4px 3px 9px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); max-width: 100%; }
.chip .k { font: 600 10.5px/1 var(--f-mono); color: var(--river); }
.chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; }
.thinking-line { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--river); animation: dot 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

/* ---------- dashboard ---------- */
.dashboard { width: var(--dash-w); border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; padding-right: env(safe-area-inset-right, 0px); }
.dash-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 8px; }
.dash-head h2 { margin: 0; font: 700 17px/1.2 var(--f-display); }
.dash-body { flex: 1; overflow-y: auto; padding: 0 14px 20px; display: grid; gap: 10px; align-content: start; }
.dsec { border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.dsec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-weight: 700; font-size: 13.5px; }
.dsec > summary::-webkit-details-marker { display: none; }
.dsec > summary .count { margin-left: auto; }
.dsec .dlist { padding: 0 12px 10px; display: grid; gap: 8px; font-size: 13px; }
.dempty { color: var(--muted); font-size: 12.5px; }
.ditem { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 3px; }
.ditem:first-child { border-top: 0; padding-top: 0; }
.ditem .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ditem q { color: var(--muted); font-style: italic; }
.conf { font: 600 10.5px/1 var(--f-mono); padding: 2px 5px; border-radius: 4px; text-transform: uppercase; }
.conf-high { background: var(--bad-soft); color: var(--bad); } .conf-medium { background: var(--warn-soft); color: var(--warn); } .conf-low { background: var(--surface-2); color: var(--muted); }
.meter { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin: 2px 0 6px; }
.meter i { display: block; height: 100%; }

/* ---------- tables & forms ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar input[type=search], .field input, .field select, .field textarea, .inline-input { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.toolbar input[type=search] { flex: 1 1 240px; }
.chipset { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 99px; cursor: pointer; font-size: 13px; }
.fchip[aria-pressed=true] { background: var(--river); border-color: var(--river); color: var(--surface); }
.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.skills-table { min-width: 940px; }

/* ---------- otter avatar ---------- */
.otter svg { width: 100%; height: 100%; overflow: visible; }
.otter .fur { fill: var(--otter-fur); }
.otter .fur-dark { fill: var(--otter-fur-dark); }
.otter .belly { fill: var(--otter-belly); }
.otter .ink { fill: var(--otter-ink); }
.otter .ink-line { stroke: var(--otter-ink); fill: none; stroke-linecap: round; }
.otter .whisker { stroke: var(--otter-fur-dark); stroke-width: .9; stroke-linecap: round; fill: none; }
.otter .paper { fill: var(--prop-paper); stroke: var(--prop-line); stroke-width: 1.2; }
.otter .pline { stroke: var(--prop-line); stroke-width: 1; stroke-linecap: round; opacity: .55; }
.otter .accent { fill: var(--river); }
.otter .warm { fill: var(--fur); }
.otter .okf { fill: var(--ok); }
.otter .warnf { fill: var(--warn); }
.otter .badf { fill: var(--bad); }
.otter .water { stroke: var(--water); stroke-width: 2.4; fill: none; stroke-linecap: round; }
.otter .glass { fill: none; stroke: var(--otter-ink); stroke-width: 1.4; }
.otter .prop, .otter .water-g { opacity: 0; transition: opacity .25s; }
.otter .eyes { transform-origin: 60px 45px; animation: blink 5.5s infinite; }
.otter .pupils { transition: transform .4s; }
.otter .brow { transition: transform .3s; }
.otter .body-g { transform-origin: 60px 80px; transition: transform .45s cubic-bezier(.3,1.4,.6,1); }
.otter .head-g { transform-origin: 60px 60px; transition: transform .35s; }
.otter .ear { transform-origin: center; transform-box: fill-box; transition: transform .3s; }
.otter .tail { transform-origin: 84px 96px; animation: tail 3.2s ease-in-out infinite; }
.otter .mouth-smile { opacity: 0; }
.otter .glasses { opacity: 0; }
.otter.glasses-on .glasses { opacity: 1; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes tail { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-7deg); } }
@keyframes look { 0%, 30% { transform: translateX(0); } 40%, 55% { transform: translateX(-1.6px); } 65%, 80% { transform: translateX(1.6px); } 90%, 100% { transform: translateX(0); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
@keyframes float { 0%, 100% { transform: translate(0, 0) rotate(-74deg); } 50% { transform: translate(0, -2px) rotate(-71deg); } }
@keyframes scan { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-8px, 3px); } }
@keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
@keyframes sway { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
@keyframes stack { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(4deg); } }
@keyframes drift { 0% { transform: translateY(4px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(-10px); opacity: 0; } }
@keyframes scratch { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-14deg); } }

.otter.s-idle .pupils { animation: look 7s ease-in-out infinite; }
.otter.s-listening .head-g { transform: rotate(-8deg); }
.otter.s-listening .ear { transform: translateY(-2px) scale(1.12); }
.otter .mouth-flat { transform-box: fill-box; transform-origin: center; }
.otter.s-speaking .mouth-flat { animation: talk .2s ease-in-out infinite alternate; }
.otter.s-speaking .head-g { animation: bob 1.6s ease-in-out infinite; }
@keyframes talk { from { transform: scaleY(1); } to { transform: scaleY(2.8); } }
.otter.s-thinking .body-g { animation: bob 2.4s ease-in-out infinite; }
.otter.s-thinking.act-floating .body-g { animation: float 3s ease-in-out infinite; }
.otter.s-thinking.act-floating .water-g { opacity: 1; }
.otter .p-float-docs { transform-origin: 60px 40px; }

.otter.s-thinking.act-inbox .p-envelopes, .otter.s-reading_email .p-envelopes { opacity: 1; }
.otter .p-envelopes .env2 { animation: sway 1.6s ease-in-out infinite; transform-box: fill-box; }
.otter.s-thinking.act-calculator .p-calculator { opacity: 1; }
.otter .p-calculator .num { animation: drift 2.2s infinite; }
.otter .p-calculator .num:nth-of-type(2) { animation-delay: .7s; } .otter .p-calculator .num:nth-of-type(3) { animation-delay: 1.4s; }
.otter.s-thinking.act-map .p-map, .otter.s-thinking.act-map .p-magnifier, .otter.s-researching .p-magnifier { opacity: 1; }
.otter.s-researching .p-magnifier, .otter.s-thinking.act-map .p-magnifier { animation: scan 2.6s ease-in-out infinite; }
.otter.s-thinking.act-papers .p-stack { opacity: 1; }
.otter .p-stack { transform-origin: 26px 104px; animation: stack 2.4s ease-in-out infinite; }
.otter.s-thinking.act-puzzle .p-puzzle { opacity: 1; }
.otter .p-puzzle .piece { animation: bob 1.8s ease-in-out infinite; transform-box: fill-box; }
.otter.s-thinking.act-coffee .p-coffee { opacity: 1; }
.otter .p-coffee .steam { animation: drift 2.4s infinite; }
.otter.s-thinking.act-briefing .p-board { opacity: 1; }
.otter.s-analyzing .p-sheet { opacity: 1; }
.otter.s-analyzing .pupils { transform: translateY(1.5px); }
.otter.s-discrepancy .brow-l { transform: translateY(-3.5px) rotate(-12deg); transform-box: fill-box; transform-origin: center; }
.otter.s-discrepancy .p-sheet { opacity: 1; }
.otter.s-conflict .p-two-papers { opacity: 1; }
.otter.s-conflict .pupils { animation: look 2.4s ease-in-out infinite; }
.otter.s-conflict .brow { transform: translateY(1.5px); }
.otter.s-opportunity .p-bulb { opacity: 1; animation: pop .6s ease-out both; }
.otter.s-opportunity .mouth-smile, .otter.s-done .mouth-smile { opacity: 1; }
.otter.s-opportunity .mouth-flat, .otter.s-done .mouth-flat { opacity: 0; }
.otter.s-drafting .p-laptop { opacity: 1; }
.otter.s-drafting .paws { animation: typing .35s steps(2) infinite; }
.otter.s-awaiting_approval .p-clipboard { opacity: 1; }

.otter.s-error .p-question { opacity: 1; }

/* ---------- simple layout (default): otter front and center, everything else one tap away ---------- */

.stage { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 16px 0; transition: padding .3s; }

@keyframes trick { 0% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-18px) rotate(-180deg); } 60% { transform: translateY(-8px) rotate(-360deg); } 80% { transform: translateY(2px) scale(1.05, .95); } 100% { transform: none; } }

.empty-chat { text-align: center; width: 100%; max-width: 760px; padding-top: 4px; }

.t-numbers { background: var(--warn-soft); } .t-decide { background: var(--surface-2); } .t-can { background: var(--bad-soft); }

<script type="module">
// ---- core/security.js ----
// O.T.T.E.R. security core: permissions, approval gate, audit log.
// Runs unchanged in Node (tests, server) and in the browser. The model never gets a handle
// to approve() or execute(); it can only call propose(). Approval is bound to a SHA-256
// digest of {type, target, content}, is single use, and execute() re-hashes the payload it
// is handed, so a changed recipient or body cannot ride on an old approval.

class SecurityError extends Error {
  constructor(code, message) {
    super(message);
    this.code = code;
  }
}

// ---------- hashing ----------
function canonical(value) {
  if (value === null || typeof value !== "object") return JSON.stringify(value);
  if (Array.isArray(value)) return "[" + value.map(canonical).join(",") + "]";
  return "{" + Object.keys(value).sort().map((k) => JSON.stringify(k) + ":" + canonical(value[k])).join(",") + "}";
}

async function sha256(text) {
  const bytes = new TextEncoder().encode(text);
  const buf = await globalThis.crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

function newId(prefix) {
  const r = globalThis.crypto.getRandomValues(new Uint8Array(6));
  return prefix + "_" + [...r].map((b) => b.toString(16).padStart(2, "0")).join("");
}

// ---------- systems and permissions ----------
// Every system starts at "none". Granting is a UI-only operation. An existing browser
// sign-in is deliberately not an input to any check: authentication is not authorization.
const SYSTEMS = {
  anthropic_api: { label: "Claude API (local server, your API key)", protected: false, kind: "ai_service" },
  claude_ai: { label: "Claude on claude.ai (your account)", protected: false, kind: "ai_service" },
  web_research: { label: "Public web research", protected: false, kind: "research" },
  outlook: { label: "Outlook / Microsoft 365 mail", protected: true, kind: "institutional" },
  sharepoint: { label: "SharePoint / OneDrive", protected: true, kind: "institutional" },
  teams: { label: "Microsoft Teams", protected: true, kind: "institutional" },
  banner: { label: "Banner (student information system)", protected: true, kind: "institutional" },
  synergy: { label: "Synergy (K-12 student records)", protected: true, kind: "institutional" },
  paycom: { label: "Paycom", protected: true, kind: "institutional" },
  intacct: { label: "Sage Intacct", protected: true, kind: "institutional" },
  jotform: { label: "Jotform", protected: true, kind: "institutional" },
  google_forms: { label: "Google Forms", protected: true, kind: "institutional" },
  ms_forms: { label: "Microsoft Forms", protected: true, kind: "institutional" },
  website_cms: { label: "bluecc.edu WordPress / Elementor", protected: true, kind: "institutional" },
  google_drive: { label: "Google Drive", protected: true, kind: "personal_cloud" },
  gmail: { label: "Gmail", protected: true, kind: "personal_cloud" },
  calendar: { label: "Calendar", protected: true, kind: "personal_cloud" },
  canva: { label: "Canva", protected: true, kind: "personal_cloud" },
  chrome: { label: "Claude in Chrome (browser extension)", protected: true, kind: "browser" },
  builtin_browser: { label: "Claude desktop built-in browser", protected: true, kind: "browser" },
  desktop: { label: "Desktop control (computer use)", protected: true, kind: "browser" },
  claude_memory: { label: "Claude memory", protected: false, kind: "ai_service" },
  local_knowledge: { label: "O.T.T.E.R. local knowledge base", protected: false, kind: "local" },
  system_volume: { label: "This computer's volume (local server only)", protected: false, kind: "device" },
  browser_speech: { label: "Listening: browser speech recognition (audio may go to Google, Microsoft or Apple)", protected: false, kind: "ai_service" },
  cloud_voice: { label: "Online voices: answer text sent to Microsoft or Google to be spoken", protected: false, kind: "ai_service" },
};

const SCOPE_RANK = { none: 0, read: 1, write: 2 };

class PermissionRegistry {
  constructor(state = {}, { audit, now = () => Date.now() } = {}) {
    this.audit = audit;
    this.now = now;
    this.grants = {};
    for (const key of Object.keys(SYSTEMS)) {
      const g = state[key];
      this.grants[key] = g && SCOPE_RANK[g.scope] !== undefined ? { ...g } : { scope: "none" };
    }
    // Local knowledge is O.T.T.E.R.'s own store; reading it is always allowed, writing goes
    // through the approval gate like everything else.
    if (this.grants.local_knowledge.scope === "none") this.grants.local_knowledge = { scope: "write", purpose: "built-in" };
  }
  toJSON() {
    return this.grants;
  }
  scope(system) {
    return (this.grants[system] || { scope: "none" }).scope;
  }
  grant(system, scope, { purpose = "", expiresAt = null } = {}) {
    if (!SYSTEMS[system]) throw new SecurityError("unknown_system", `Unknown system: ${system}`);
    if (!(scope in SCOPE_RANK)) throw new SecurityError("bad_scope", `Unknown scope: ${scope}`);
    if (SYSTEMS[system].protected && scope !== "none" && !purpose.trim())
      throw new SecurityError("purpose_required", `Granting ${SYSTEMS[system].label} needs a stated purpose and scope.`);
    this.grants[system] = { scope, purpose, grantedAt: this.now(), expiresAt };
    this.audit?.record("permission.grant", { system, scope, purpose });
  }
  revoke(system) {
    this.grants[system] = { scope: "none", revokedAt: this.now() };
    this.audit?.record("permission.revoke", { system });
  }
  // `context` may carry {authenticatedSession: true}; it is ignored on purpose.
  check(system, needed = "read", context = {}) {
    void context;
    const g = this.grants[system];
    if (!g) return false;
    if (g.expiresAt && this.now() > g.expiresAt) return false;
    return SCOPE_RANK[g.scope] >= SCOPE_RANK[needed];
  }
  require(system, needed = "read", context = {}) {
    if (!this.check(system, needed, context)) {
      const label = SYSTEMS[system]?.label || system;
      throw new SecurityError("not_authorized", `Locked door: ${label} is not authorized for ${needed}. Grant it in Settings > Permissions if BMCC policy allows.`);
    }
  }
}

// ---------- audit log ----------
// Records what happened without storing the content itself: payloads are kept as digests
// and short redacted labels only.
class AuditLog {
  constructor(entries = [], { redact = (s) => s, now = () => Date.now(), limit = 2000 } = {}) {
    this.entries = entries;
    this.redact = redact;
    this.now = now;
    this.limit = limit;
    this.listeners = new Set();
  }
  record(event, details = {}) {
    const safe = {};
    for (const [k, v] of Object.entries(details)) {
      if (["content", "body", "text", "payload"].includes(k)) continue; // never logged
      safe[k] = typeof v === "string" ? this.redact(v).slice(0, 160) : v;
    }
    const entry = { ts: this.now(), event, ...safe };
    this.entries.push(entry);
    if (this.entries.length > this.limit) this.entries.splice(0, this.entries.length - this.limit);
    for (const fn of this.listeners) fn(entry);
    return entry;
  }
  toJSON() {
    return this.entries;
  }
}

// ---------- actions ----------
// Every consequential action type. `system` is the system it would touch; `external` means
// it leaves O.T.T.E.R. Unknown types are refused outright.
const ACTION_TYPES = {
  send_email: { label: "Send email", system: "outlook", external: true },
  reply_email: { label: "Reply to email", system: "outlook", external: true },
  forward_email: { label: "Forward email", system: "outlook", external: true },
  modify_email: { label: "Archive, delete, flag or move email", system: "outlook", external: true },
  schedule_meeting: { label: "Schedule meeting", system: "outlook", external: true },
  send_invitation: { label: "Send invitation", system: "outlook", external: true },
  post_content: { label: "Post content", system: "website_cms", external: true },
  submit_form: { label: "Submit form", system: "chrome", external: true },
  upload_file: { label: "Upload file", system: "sharepoint", external: true },
  download_file: { label: "Download institutional file", system: "sharepoint", external: true },
  create_record: { label: "Create record", system: "sharepoint", external: true },
  modify_record: { label: "Modify record", system: "sharepoint", external: true },
  edit_document: { label: "Edit document or spreadsheet", system: "sharepoint", external: true },

const STATUS_LABELS = {
  pending: "Proposed: waiting for your approval",
  approved: "Approved: not yet run",
  rejected: "Cancelled by you",
  superseded: "Replaced by a revised proposal",
  executed: "Done",
  not_executed: "Approved, but not run: no authorized integration",
  failed: "Failed",
};

function describeProposalStatus(p) {
  const done = p.status === "executed";
  return { label: STATUS_LABELS[p.status] || p.status, isCompleted: done, isProposal: p.status === "pending" || p.status === "approved" };
}

class ApprovalGate {
  constructor({ permissions, audit, executors = {}, proposals = [], now = () => Date.now() }) {
    this.permissions = permissions;
    this.audit = audit;
    this.executors = executors;
    this.proposals = new Map(proposals.map((p) => [p.id, p]));
    this.now = now;
    this.listeners = new Set();
  }
  list() {
    return [...this.proposals.values()];
  }
  get(id) {
    return this.proposals.get(id);
  }
  _emit(p) {
    for (const fn of this.listeners) fn(p);
  }
  static payloadOf(p) {
    return { type: p.type, target: p.target, content: p.content };
  }
  async propose({ type, target, content, consequences = "", origin = "assistant", untrustedContext = false, skill = null }) {
    const spec = ACTION_TYPES[type];
    if (!spec) throw new SecurityError("unknown_action", `Unknown action type "${type}". Nothing was proposed.`);
    if (typeof target !== "string" || !target.trim()) throw new SecurityError("bad_target", "An action needs an explicit target.");
    if (typeof content !== "string") content = JSON.stringify(content ?? "");
    const p = {
      id: newId("act"),
      type,
      label: spec.label,
      system: spec.system,
      external: spec.external,
      target: target.trim(),
      content,
      consequences: String(consequences || (spec.external ? "Leaves O.T.T.E.R. and changes an external system." : "Changes O.T.T.E.R.'s local records.")),
      origin,
      skill,
      untrustedContext: !!untrustedContext,
      status: "pending",
      createdAt: this.now(),
    };
    p.digest = await sha256(canonical(ApprovalGate.payloadOf(p)));
    this.proposals.set(p.id, p);
    this.audit?.record("action.proposed", { id: p.id, type, target: p.target, digest: p.digest, origin, untrustedContext: p.untrustedContext });
    this._emit(p);
    return p;
  }
  // Called only from the approval panel. confirmDigest is the digest the panel displayed,
  // which ties the approval to exactly what the user looked at.
  approve(id, { confirmDigest, by = "user" } = {}) {
    const p = this.proposals.get(id);
    if (!p) throw new SecurityError("not_found", "No such proposal.");
    if (p.status !== "pending") throw new SecurityError("not_pending", `This proposal is ${p.status}; it cannot be approved.`);
    if (confirmDigest !== p.digest) throw new SecurityError("digest_mismatch", "The proposal changed after it was shown. Review it again.");
    p.status = "approved";
    p.approval = { by, at: this.now(), digest: p.digest, used: false };
    this.audit?.record("action.approved", { id, type: p.type, target: p.target, digest: p.digest, by });
    this._emit(p);
    return p;
  }
  reject(id, { reason = "" } = {}) {
    const p = this.proposals.get(id);
    if (!p) throw new SecurityError("not_found", "No such proposal.");
    if (!["pending", "approved"].includes(p.status)) throw new SecurityError("not_open", `This proposal is already ${p.status}.`);
    p.status = "rejected";
    p.rejectedAt = this.now();
    if (p.approval) p.approval.used = true;
    this.audit?.record("action.rejected", { id, type: p.type, reason });
    this._emit(p);
    return p;
  }
  // A revision is a new proposal; the old one can never execute.
  async revise(id, changes) {
    const old = this.proposals.get(id);
    if (!old) throw new SecurityError("not_found", "No such proposal.");
    if (!["pending", "approved"].includes(old.status)) throw new SecurityError("not_open", `This proposal is already ${old.status}.`);
    old.status = "superseded";
    if (old.approval) old.approval.used = true;
    const next = await this.propose({
      type: changes.type ?? old.type,
      target: changes.target ?? old.target,
      content: changes.content ?? old.content,
      consequences: changes.consequences ?? old.consequences,
      origin: "user_revision",
      untrustedContext: old.untrustedContext,
      skill: old.skill,
    });
    next.revises = old.id;
    this.audit?.record("action.revised", { id: old.id, next: next.id });
    this._emit(old);
    return next;
  }
  // payload is what will actually run. It must hash to the approved digest.
  async execute(id, payload) {
    const p = this.proposals.get(id);
    if (!p) throw new SecurityError("not_found", "No such proposal.");
    if (p.status !== "approved" || !p.approval) {
      this.audit?.record("action.blocked", { id, reason: "not_approved", status: p.status });
      throw new SecurityError("not_approved", "Blocked: this action has not been approved.");
    }
    if (p.approval.used) throw new SecurityError("approval_used", "Blocked: approvals are single use.");
    const run = payload ?? ApprovalGate.payloadOf(p);
    const digest = await sha256(canonical({ type: run.type, target: run.target, content: run.content }));
    if (digest !== p.approval.digest) {
      this.audit?.record("action.blocked", { id, reason: "payload_changed", digest });
      throw new SecurityError("payload_changed", "Blocked: the destination or content differs from what you approved.");
    }
    p.approval.used = true;
    const spec = ACTION_TYPES[p.type];
    const executor = this.executors[p.type];
    try {
      if (!executor) {
        p.status = "not_executed";
        p.result = { ok: false, message: `No authorized integration for "${spec.label}" exists in O.T.T.E.R. Nothing was sent or changed. The approved content is ready for you to use yourself.` };
      } else {
        this.permissions.require(spec.system, "write");
        const result = await executor(run, p);
        p.status = result?.ok === false ? "not_executed" : "executed";
        p.result = result || { ok: true };
      }
    } catch (e) {
      p.status = e instanceof SecurityError ? "not_executed" : "failed";
      p.result = { ok: false, message: e.message, code: e.code || "error" };
    }
    p.finishedAt = this.now();
    this.audit?.record("action.result", { id, type: p.type, status: p.status, message: p.result?.message || "" });
    this._emit(p);
    return p;
  }
}

// ---------- advisor, not actor ----------
// O.T.T.E.R. may carry out only its own local bookkeeping (knowledge, tasks) and, on the local
// server, this computer's volume. Anything that would act on BMCC systems, cloud accounts or
// the browser has no executor at all, so even an approved proposal comes back to Dr. Prevot
// as text for him to act on. This check refuses to start if that ever changes.
const ACTOR_KINDS = ["institutional", "personal_cloud", "browser"];
function assertAdvisorOnly(executors) {
  const bad = Object.keys(executors).filter((t) => ACTOR_KINDS.includes(SYSTEMS[ACTION_TYPES[t]?.system]?.kind) || ACTION_TYPES[t]?.system === "claude_ai");
  if (bad.length) throw new SecurityError("not_advisor", `O.T.T.E.R. is an advisor; these would let it act on outside systems: ${bad.join(", ")}`);
  return true;
}

// ---------- skills ----------
function skillStatus(skill, { permissions, settings = {} }) {
  const disabled = (settings.disabledSkills || []).includes(skill.name);
  if (disabled) return { status: "disabled", runnable: false, reason: "Disabled in Settings." };
  if (skill.sensitivity?.includes("ferpa_student_records") && !settings.ferpaAttested)
    return { status: "restricted", runnable: false, reason: "Touches student education records. Blocked until a FERPA basis and institutional approval are recorded in Settings." };
  const missing = (skill.systems || []).filter((s) => SYSTEMS[s] && !permissions.check(s, "read"));
  if (skill.needsBrowser)
    return { status: "handoff", runnable: false, handoff: true, missing, reason: "Runs in Claude in Chrome or the desktop app, which this app cannot reach. O.T.T.E.R. prepares a hand-off brief for your approval." };
  if (missing.length) return { status: "unavailable", runnable: false, missing, reason: "Needs authorization: " + missing.map((m) => SYSTEMS[m].label).join(", ") };
  return { status: "available", runnable: true, reason: "Ready for in-app analysis." };
}

function assertSkillRunnable(skill, ctx) {
  const st = skillStatus(skill, ctx);
  if (!st.runnable) throw new SecurityError("skill_" + st.status, `Skill ${skill.name} cannot run: ${st.reason}`);
  return st;
}

// ---- core/privacy.js ----
// Privacy guard: detects protected data, redacts it, and decides whether text may leave the
// device for a given AI service. Detection is pattern based, so it is a safeguard, not a
// compliance certification; anything it flags must be cleared by a person.

const LUHN = (digits) => {
  let sum = 0, alt = false;
  for (let i = digits.length - 1; i >= 0; i--) {
    let n = +digits[i];
    if (alt) { n *= 2; if (n > 9) n -= 9; }
    sum += n; alt = !alt;
  }
  return sum % 10 === 0;
};

// severity: block = never leaves the device; ferpa = education-record indicator;
// high = identifying; medium = contact details.
const DETECTORS = [
  { category: "credential", severity: "block", label: "Password or secret", re: /\b(?:password|passcode|passwd|pwd|api[_ -]?key|secret|token)\s*[:=]\s*\S{4,}/gi },
  { category: "credential", severity: "block", label: "API key", re: /\bsk-[A-Za-z0-9_-]{16,}\b/g },
  { category: "ssn", severity: "block", label: "Social Security number", re: /\b(?!000|666|9\d\d)\d{3}-(?!00)\d{2}-(?!0000)\d{4}\b/g },
  { category: "card", severity: "block", label: "Payment card number", re: /\b(?:\d[ -]?){13,19}\b/g, check: (m) => LUHN(m.replace(/\D/g, "")) && m.replace(/\D/g, "").length >= 13 },
  { category: "student_id", severity: "ferpa", label: "Student ID number", re: /\b(?:student\s*(?:id|#|no\.?|number)|SID|BMCC\s*ID)\s*[:#]?\s*[A-Z]?\d{5,10}\b/gi },
  { category: "dob", severity: "high", label: "Date of birth", re: /\b(?:DOB|date of birth|birth\s*date)\s*[:\-]?\s*\d{1,2}[/-]\d{1,2}[/-]\d{2,4}/gi },
  { category: "education_record", severity: "ferpa", label: "Education-record detail (grades, transcript, aid, disability, discipline)", re: /\b(?:GPA|transcripts?|final grades?|failing (?:grade|students?|the class)|grade of [A-DF][+-]?|academic (?:probation|suspension)|financial aid (?:award|status)|FAFSA|disability (?:services|accommodation)|IEP|504 plan|disciplinary (?:record|action)|enrollment status of)\b/gi },
  { category: "email", severity: "medium", label: "Email address", re: /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/g },
  { category: "phone", severity: "medium", label: "Phone number", re: /(?<!\d)(?:\+?1[ .-]?)?\(?\d{3}\)?[ .-]\d{3}[ .-]\d{4}(?!\d)/g },
];

function scanSensitive(text = "") {
  const findings = [];
  for (const d of DETECTORS) {
    d.re.lastIndex = 0;
    for (const m of String(text).matchAll(d.re)) {
      if (d.check && !d.check(m[0])) continue;
      findings.push({ category: d.category, severity: d.severity, label: d.label, index: m.index, length: m[0].length, preview: mask(m[0]) });
    }
  }
  // Overlapping matches: keep the most severe
  const rank = { block: 4, ferpa: 3, high: 2, medium: 1 };
  findings.sort((a, b) => a.index - b.index || rank[b.severity] - rank[a.severity]);
  const out = [];
  for (const f of findings) {
    const prev = out[out.length - 1];
    if (prev && f.index < prev.index + prev.length) continue;
    out.push(f);
  }
  return out;
}

function mask(s) {
  if (s.length <= 4) return "****";
  return s.slice(0, 2) + "*".repeat(Math.min(8, s.length - 4)) + s.slice(-2);
}

function redact(text = "", findings = scanSensitive(text), { categories = null } = {}) {
  let out = "";
  let pos = 0;
  for (const f of findings) {
    if (categories && !categories.includes(f.category)) continue;
    // education_record flags context words, not identifiers; leave the words in place
    if (f.category === "education_record") continue;
    out += text.slice(pos, f.index) + `[REDACTED ${f.category.toUpperCase()}]`;
    pos = f.index + f.length;
  }
  return out + text.slice(pos);
}

const redactForLog = (s) => redact(String(s));

// settings: {approvedServices: [...], ferpaAttested: bool, allowContactDetails: bool}
function evaluateOutbound(text, service, settings = {}) {
  const approved = (settings.approvedServices || []).includes(service);
  const findings = scanSensitive(text);
  const counts = {};
  for (const f of findings) counts[f.severity] = (counts[f.severity] || 0) + 1;
  if (!approved)
    return { decision: "block", reason: `The AI service "${service}" has not been approved for BMCC work content. Approve it in Settings > Privacy after confirming BMCC permits it.`, findings };
  if (counts.block)
    return { decision: "block", reason: "Contains a password, SSN, payment card or secret. These never leave this device. Remove them and try again.", findings };
  if (counts.ferpa && !settings.ferpaAttested)
    return { decision: "block", reason: "Looks like it contains student education-record information. FERPA processing is off. Remove it, or record the lawful basis and institutional approval in Settings > Privacy first.", findings };
  if (counts.high || (counts.medium && !settings.allowContactDetails))
    return { decision: "redact", reason: "Identifying details were found and will be replaced with placeholders before sending.", findings, text: redact(text, findings) };
  return { decision: "allow", findings, text };
}

// ---------- untrusted content ----------
const INJECTION_PATTERNS = [
  /ignore (?:all |any )?(?:previous|prior|above) (?:instructions|rules)/i,
  /disregard (?:your|the) (?:instructions|rules|system prompt)/i,
  /you are now|new instructions?:|system prompt/i,
  /(?:forward|send|email|transfer|wire) (?:this|all|the)? ?(?:emails?|messages?|files?|data|funds|money|credentials?) to/i,
  /approve (?:this|the) (?:action|request) (?:automatically|without)/i,
  /do not (?:tell|inform|notify) (?:the )?user/i,
  /(?:click|press) (?:the )?(?:submit|send|publish|approve)/i,
];

function detectInjection(text = "") {
  return INJECTION_PATTERNS.filter((re) => re.test(text)).map((re) => re.source);
}

// Wraps external content so the model sees it as quoted data. Closing tags inside the
// content are neutralized so the content cannot end the wrapper early.
function wrapUntrusted(source) {
  const safe = String(source.text || "").replace(/<\/?\s*untrusted_content/gi, "&lt;untrusted_content");
  return `<untrusted_content id="${source.id}" kind="${source.kind}" title="${String(source.title || "").replace(/"/g, "'")}">\n${safe}\n</untrusted_content>`;
}

// ---- core/analysis.js ----
// Deterministic analysis that works with no AI connected: email-thread parsing, figure
// extraction, discrepancy candidates and evidence checking. Everything it reports points
// back to a verbatim line in a source the user supplied.

const MONTHS = "jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?";
const ABS_DATE = new RegExp(`\\b(?:(?:${MONTHS})\\.? \\d{1,2}(?:st|nd|rd|th)?(?:,? \\d{4})?|\\d{1,2}/\\d{1,2}(?:/\\d{2,4})?|\\d{4}-\\d{2}-\\d{2})\\b`, "i");
const REL_DATE = /\b(?:by|before|no later than|due|until)\s+(?:(?:this|next)\s+)?(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday|tomorrow|end of (?:day|week|month)|eod|eow|cob)\b|\b(?:asap|as soon as possible|next week|soon|this week|end of the month)\b/i;

function normalizeSpace(s) {
  return String(s).replace(/\s+/g, " ").trim();
}

function splitSentences(text) {
  return normalizeSpace(text).split(/(?<=[.!?])\s+(?=[A-Z"'(])/).filter(Boolean);
}

// ---------- email ----------
function parseThread(text) {
  const lines = String(text).replace(/\r/g, "").split("\n");
  const messages = [];
  let cur = null;
  const header = /^\s*(From|To|Cc|Date|Sent|Subject)\s*:\s*(.*)$/i;
  for (const line of lines) {
    const h = line.match(header);
    if (h && h[1].toLowerCase() === "from") {
      cur = { from: h[2].trim(), to: "", date: "", subject: "", body: [] };
      messages.push(cur);
      continue;
    }
    if (h && cur && cur.body.length === 0) {
      const k = h[1].toLowerCase() === "sent" ? "date" : h[1].toLowerCase();
      cur[k] = h[2].trim();
      continue;
    }
    if (/^\s*-{2,}\s*(?:original message|forwarded message)\s*-{2,}/i.test(line)) continue;
    if (!cur) {
      cur = { from: "(unknown sender)", to: "", date: "", subject: "", body: [] };
      messages.push(cur);
    }
    cur.body.push(line.replace(/^>\s?/, ""));
  }
  for (const m of messages) m.body = m.body.join("\n").trim();
  return messages.filter((m) => m.body || m.subject);
}

function isMe(sender, me) {
  if (!me?.length) return false;
  const s = sender.toLowerCase();
  return me.some((n) => n && s.includes(n.toLowerCase()));
}

function analyzeEmail(text, { me = ["Arnaud", "Prevot"] } = {}) {
  const messages = parseThread(text);
  const out = { messages: messages.map(({ from, to, date, subject }) => ({ from, to, date, subject })), deadlines: [], actionItems: [], myCommitments: [], othersCommitments: [], questions: [], conflicts: [] };
  messages.forEach((m, i) => {
    const mine = isMe(m.from, me);
    for (const s of splitSentences(m.body)) {
      const abs = s.match(ABS_DATE);
      const rel = s.match(REL_DATE);
      if (abs && /\b(?:by|due|deadline|before|no later than|until|on)\b/i.test(s))
        out.deadlines.push({ quote: s, from: m.from, date: abs[0], basis: "explicit", messageIndex: i });
      else if (rel) out.deadlines.push({ quote: s, from: m.from, date: rel[0], basis: "inferred", note: "Relative wording; the actual date depends on when it was sent.", messageIndex: i });
      if (/\b(?:I will|I'll|I can|we will|we'll|I am going to|I'm going to)\b/i.test(s))
        (mine ? out.myCommitments : out.othersCommitments).push({ quote: s, from: m.from, messageIndex: i });
      if (/\b(?:please|can you|could you|would you|need you to|make sure|action required|let me know)\b/i.test(s) && !mine)
        out.actionItems.push({ quote: s, from: m.from, messageIndex: i });
      if (/\?\s*$/.test(s)) {
        const later = messages.slice(i + 1).some((n) => n.from !== m.from);
        out.questions.push({ quote: s, from: m.from, messageIndex: i, possiblyUnanswered: !later });
      }
    }
  });
  // Same kind of figure stated differently across messages in the thread
  out.conflicts = findDiscrepancies(messages.map((m, i) => ({ id: `msg${i + 1}`, title: `${m.from}${m.date ? " (" + m.date + ")" : ""}`, text: m.body })));
  return out;
}

// ---------- figures and discrepancies ----------
const MONEY = /\$\s?\d[\d,]*(?:\.\d{1,2})?\s?(?:k|K|million|M)?/g;
const COUNT = /\b(\d[\d,]*)\s+(students|participants|enrollees|enrollments|registrations|seats|hours|sessions|FTEs?|employees|staff|positions|trainees|completers|graduates)\b/gi;
const LABEL_STOP = new Set("the a an of for in on at to is was are were be will our their this that and or with by from about approximately around roughly".split(" "));

function parseMoney(s) {
  let v = parseFloat(s.replace(/[$,\s]/g, ""));
  if (/k$/i.test(s.trim())) v *= 1000;
  if (/(?:million|M)$/.test(s.trim())) v *= 1e6;
  return v;
}

function labelBefore(line, index) {
  const before = line.slice(0, index).replace(/[:=\-–|]+\s*$/, "");
  const words = (before.toLowerCase().match(/[a-z][a-z&/-]*/g) || []).filter((w) => !LABEL_STOP.has(w));
  return words.slice(-3).join(" ");
}

function extractFigures(doc) {
  const figs = [];
  const lines = String(doc.text).split(/\n/);
  lines.forEach((line, li) => {
    MONEY.lastIndex = 0;
    for (const m of line.matchAll(MONEY)) {
      const label = labelBefore(line, m.index);
      if (!label) continue;
      figs.push({ docId: doc.id, docTitle: doc.title, kind: "money", label, value: parseMoney(m[0]), raw: m[0].trim(), quote: line.trim(), line: li + 1, isTotal: /\btotal\b/i.test(line.slice(0, m.index)) });
    }
    COUNT.lastIndex = 0;
    for (const m of line.matchAll(COUNT)) {
      const unit = m[2].toLowerCase().replace(/s$/, "");
      const label = (labelBefore(line, m.index) + " " + unit).trim();
      figs.push({ docId: doc.id, docTitle: doc.title, kind: "count", label, unit, value: parseFloat(m[1].replace(/,/g, "")), raw: m[0], quote: line.trim(), line: li + 1 });
    }
  });
  return figs;
}

const keyOf = (f) => (f.kind === "count" ? "count:" + f.unit : f.kind + ":" + f.label.split(" ").slice(-2).join(" "));

// Returns candidates, never verdicts. Confidence reflects how sure we are that two lines
// describe the same thing, not that one of them is wrong.
function findDiscrepancies(docs) {
  const figs = docs.flatMap(extractFigures);
  const byKey = new Map();
  for (const f of figs) {
    const k = keyOf(f);
    if (!byKey.has(k)) byKey.set(k, []);
    byKey.get(k).push(f);
  }
  const results = [];
  for (const [k, list] of byKey) {
    const docsInvolved = new Set(list.map((f) => f.docId));
    const values = new Set(list.map((f) => f.value));
    if (docsInvolved.size < 2 || values.size < 2) continue;
    const fullLabelMatch = new Set(list.map((f) => f.label)).size === 1;
    const sorted = [...list].sort((a, b) => a.value - b.value);
    const lo = sorted[0], hi = sorted[sorted.length - 1];
    results.push({
      type: "conflicting_figures",
      key: k,
      finding: `"${lo.label}" is stated as ${lo.raw} in ${lo.docTitle} and ${hi.raw} in ${hi.docTitle}.`,
      evidence: list.map((f) => ({ sourceId: f.docId, sourceTitle: f.docTitle, quote: f.quote })),
      confidence: fullLabelMatch ? "medium" : "low",
      difference: hi.value - lo.value,
      possibleExplanations: ["The documents are from different dates or drafts.", "They measure different things (budgeted vs actual, headcount vs FTE, gross vs net).", "One figure is a typo or was not updated."],
    });
  }
  // Internal totals: a "total" line that does not equal the itemized lines above it
  for (const d of docs) {
    const df = extractFigures(d).filter((f) => f.kind === "money");
    df.forEach((t, ti) => {
      if (!t.isTotal) return;
      const items = [];
      for (let j = ti - 1; j >= 0 && !df[j].isTotal; j--) items.unshift(df[j]);
      if (items.length < 2) return;
      const sum = items.reduce((s, f) => s + f.value, 0);
      if (Math.abs(sum - t.value) > 0.5)
        results.push({
          type: "total_mismatch",
          key: "total:" + d.id + ":" + t.line,
          finding: `In ${d.title}, the line items add up to $${sum.toLocaleString()} but the stated total is ${t.raw}.`,
          evidence: [...items, t].map((f) => ({ sourceId: d.id, sourceTitle: d.title, quote: f.quote })),
          confidence: "high",
          difference: t.value - sum,
          possibleExplanations: ["A line item is missing from the list.", "The total includes indirect costs or fees not itemized here.", "Arithmetic error."],
        });
    });
  }
  return results;
}

// Anti-fabrication: a quote counts as evidence only if it appears verbatim (ignoring
// whitespace and case) in a source the user actually supplied.
function verifyEvidence(evidence, sources) {
  const index = new Map(sources.map((s) => [s.id, normalizeSpace(s.text).toLowerCase()]));
  const results = (evidence || []).map((e) => {
    const hay = index.get(e.sourceId ?? e.source_id);
    const quote = normalizeSpace(e.quote || "").toLowerCase();
    const ok = !!hay && quote.length >= 8 && hay.includes(quote);
    return { ...e, verified: ok, why: ok ? "" : !hay ? "unknown source" : quote.length < 8 ? "quote too short" : "quote not found in source" };
  });
  return { ok: results.length > 0 && results.every((r) => r.verified), results };
}

// ---------- knowledge search ----------
function searchKnowledge(items, query, limit = 6) {
  const q = (query.toLowerCase().match(/[a-z0-9]{3,}/g) || []);
  if (!q.length) return [];
  return items
    .map((it) => {
      const hay = (it.title + " " + it.text + " " + (it.tags || []).join(" ")).toLowerCase();
      const score = q.reduce((s, w) => s + (hay.includes(w) ? 1 : 0), 0);
      return { it, score };
    })
    .filter((x) => x.score > 0)
    .sort((a, b) => b.score - a.score || (b.it.updatedAt || 0) - (a.it.updatedAt || 0))
    .slice(0, limit)
    .map((x) => x.it);
}

// ---- core/orchestrator.js ----
// Skill orchestration: turns a request into a plan of which discovered skills apply, in what
// order, and in what mode. Analysis-mode skills feed one integrated answer inside
// O.T.T.E.R.; hand-off skills become approval-gated briefs; blocked skills are reported
// with the reason. Nothing here can lift a restriction set in security.js.

// Intent rules: phrases in the request -> skills that serve it, and the role each plays.
const INTENTS = [

  { id: "discrepancy", re: /discrepanc|inconsisten|doesn'?t (?:add up|match)|conflict/i, skills: [], frame: "discrepancy" },

const COUNTIES = [
  [/baker/i, "brand-personality-skill-baker-county"],
  [/grant county|john day/i, "brand-personality-skill-grant-county"],
  [/hermiston|umatilla|west end|eohec/i, "brand-personality-skill-hermiston-west-umatilla"],
  [/morrow|boardman/i, "brand-personality-skill-morrow-county"],
  [/union county|la grande/i, "brand-personality-skill-union-county"],
];

function keywordMatches(request, skills, exclude) {
  const words = new Set((request.toLowerCase().match(/[a-z][a-z0-9-]{3,}/g) || []).filter((w) => !["that", "this", "with", "from", "have", "what", "should", "would", "about", "please", "need", "want", "make", "help"].includes(w)));
  return skills
    .filter((s) => !exclude.has(s.name) && s.bmcc)
    .map((s) => {
      const hay = (s.name.replace(/-/g, " ") + " " + s.description).toLowerCase();
      let score = 0;
      for (const w of words) if (hay.includes(w)) score++;
      return { s, score };
    })
    .filter((x) => x.score >= 3)
    .sort((a, b) => b.score - a.score)
    .slice(0, 2);
}

function planRequest(request, registry, { permissions, settings }) {
  const byName = new Map(registry.map((s) => [s.name, s]));
  const intents = INTENTS.filter((i) => i.re.test(request));
  const steps = [];
  const seen = new Set();
  const add = (name, role, why) => {
    if (seen.has(name)) return;
    const skill = byName.get(name);
    if (!skill) {
      steps.push({ name, role, why, mode: "missing", status: "missing", reason: "Not found among discovered skills." });
      seen.add(name);
      return;
    }
    const st = skillStatus(skill, { permissions, settings });
    const mode = st.runnable ? "analysis" : st.handoff ? "handoff" : "blocked";
    steps.push({ name, role, why, mode, status: st.status, reason: st.reason, missing: st.missing || [] });
    seen.add(name);
  };
  for (const intent of intents) {
    for (const [name, role] of intent.skills) {
      if (intent.county) {
        const c = COUNTIES.find(([re]) => re.test(request));
        if (c) { add(c[1], "county-scoped brand scan", intent.id); continue; }
      }
      add(name, role, intent.id);
    }
  }
  for (const { s } of keywordMatches(request, registry, seen)) add(s.name, "related by description", "keyword");
  const frames = [...new Set(intents.map((i) => i.frame).filter(Boolean))];
  return {
    request,
    intents: intents.map((i) => i.id),
    frames,
    steps,
    // Analysis skills can inform the answer together; hand-offs come after, one approval each.
    parallel: steps.filter((s) => s.mode === "analysis").map((s) => s.name),
    sequential: steps.filter((s) => s.mode === "handoff").map((s) => s.name),
    blocked: steps.filter((s) => s.mode === "blocked" || s.mode === "missing"),
  };
}

function planSummary(plan) {
  if (!plan.steps.length) return "No discovered skill matches this request; O.T.T.E.R. answers directly.";
  return plan.steps.map((s) => `- ${s.name} (${s.role}): ${s.mode}${s.mode === "analysis" ? "" : " - " + s.reason}`).join("\n");
}

// The text a hand-off proposal carries. The user approves it, then pastes it into the Claude
// surface that can run the skill (Claude in Chrome, Cowork, Claude Code).
function handoffBrief(skillName, request, notes = "") {
  return [
    `Use the ${skillName} skill.`,
    `Request from Dr. Prevot: ${request}`,
    notes ? `Context prepared by O.T.T.E.R.: ${notes}` : "",
    "Stop before any Submit, Send, Publish or Next button and wait for Dr. Prevot to press it.",
  ].filter(Boolean).join("\n\n");
}

// The three-part explanation, as a callout the interface labels.
function explain(c) {
  if (c.status === "ready") return `:::finding\n**${c.name}: ready.** ${c.can || ""}\n:::`;
  return [
    ":::limitation",
    `**${c.name}** (${STATUS_TEXT[c.status].toLowerCase()})`,
    "",
    c.can ? `- **What I can do now:** ${c.can}` : null,
    `- **Why I can't:** ${c.why}`,
    `- **The missing piece:** ${c.missing}`,
    `- **With that piece, I could:** ${c.unlocks}`,
    ":::",
  ].filter((l) => l !== null).join("\n");
}

// Compact form for the system prompt.
function capabilitySummary(list) {
  return list.map((c) => `- ${c.id} [${c.status}] ${c.name}${c.status === "ready" ? "" : `. Why not: ${c.why} Missing: ${c.missing} With it: ${c.unlocks}`}`).join("\n");
}

// ---- core/advisor.js ----
// "Grow O.T.T.E.R.": learns from usage counts (never message content) and recommends new
// connectors, skills and setup changes. Every recommendation cites the evidence that
// triggered it and uses the same why / missing piece / unlocks shape as capabilities.js.

function emptyUsage() {
  return { turns: 0, intents: {}, skillModes: {}, notExecuted: {}, proposed: {}, sourceKinds: {}, capabilityAsks: {}, noSkillTopics: {}, voiceCommands: 0, lastShownAt: 0, shown: {}, dismissed: [] };
}

const inc = (obj, k, n = 1) => { obj[k] = (obj[k] || 0) + n; };

// Called after each turn with the plan and what happened. Stores counts only.
function recordTurn(usage, { plan, proposals = [], sourceKinds = [], capabilityIds = [], noSkillTopic = null }) {
  usage.turns++;
  for (const i of plan?.intents || []) inc(usage.intents, i);
  for (const s of plan?.steps || []) { usage.skillModes[s.name] ||= {}; inc(usage.skillModes[s.name], s.mode); }
  for (const p of proposals) { inc(usage.proposed, p.type); if (p.status === "not_executed") inc(usage.notExecuted, p.type); }
  for (const k of sourceKinds) inc(usage.sourceKinds, k);
  for (const c of capabilityIds) inc(usage.capabilityAsks, c);
  if (noSkillTopic) inc(usage.noSkillTopics, noSkillTopic);
  return usage;
}

function recordExecution(usage, p) {
  if (p.status === "not_executed") inc(usage.notExecuted, p.type);
}

const sumOf = (obj, keys) => keys.reduce((a, k) => a + (obj[k] || 0), 0);
const handoffCount = (u) => Object.values(u.skillModes).reduce((a, m) => a + (m.handoff || 0), 0);

// env: {engineKind, connectorsOnAccount: [...], webResearch, voice: {...}, systemVolume: {...}}
function recommend(usage, env = {}) {
  const u = usage;
  const recs = [];
  const add = (r) => { if (!u.dismissed.includes(r.id)) recs.push(r); };
  const emailUnsent = sumOf(u.notExecuted, ["send_email", "reply_email", "forward_email"]);
  const emailWork = (u.intents.email || 0) + (u.sourceKinds.email || 0);
  const calAsks = (u.capabilityAsks.calendar || 0) + sumOf(u.proposed, ["schedule_meeting", "send_invitation"]);
  const ho = handoffCount(u);

  if (emailUnsent >= 2 || emailWork >= 5)
    add({ id: "connector-m365", kind: "connector", priority: emailUnsent >= 3 ? "high" : "medium", title: "Microsoft 365 mail connection, approved by BMCC IT",
      evidence: `${emailUnsent} approved email${emailUnsent === 1 ? "" : "s"} I couldn't send, and ${emailWork} email-related request${emailWork === 1 ? "" : "s"}.`,
      why: "Every email still goes through copy and paste because BMCC blocks the connector.", missing: "A BMCC IT decision: either enable Claude's Microsoft 365 connector or approve a Graph app registration with read and send scopes.", unlocks: "read threads directly and send what you approve, one approval per message.", effort: "A request to BMCC IT; no work on your side after approval." });

  if (calAsks >= 2)
    add({ id: "connector-calendar", kind: "connector", priority: "medium", title: (env.connectorsOnAccount || []).includes("Google Calendar") ? "Wire your Google Calendar connector into O.T.T.E.R. (read-only)" : "A calendar connection",
      evidence: `${calAsks} scheduling request${calAsks === 1 ? "" : "s"} I couldn't act on.`,
      why: "I can't see availability or prepare invitations.", missing: (env.connectorsOnAccount || []).includes("Google Calendar") ? "The Google Calendar connector is already on your claude.ai account; O.T.T.E.R. needs a build step to use it, plus your read-only permission. For BMCC meetings, Outlook calendar access through BMCC IT." : "A calendar connector and your permission.", unlocks: "find times, write meeting briefs, and propose invitations for approval.", effort: "One build change for Google; a BMCC IT request for Outlook." });

  if (ho >= 3)
    add({ id: "surface-cowork", kind: "setup", priority: "high", title: "Run your form-filling skills from Cowork or Claude in Chrome",
      evidence: `${ho} times a request needed a skill that only runs in Chrome or the desktop app.`,
      why: "O.T.T.E.R. can only write hand-off briefs for those skills.", missing: "Opening Cowork (Claude desktop app) or Claude in Chrome with the brief O.T.T.E.R. prepares. A future version could live inside Cowork itself.", unlocks: "finish course requests, PSCs, IR forms and website updates end to end, stopping before Submit.", effort: "Your habit change, or a later build of O.T.T.E.R. as a Cowork plugin." });

  if (env.engineKind !== "server" && ((u.intents.research || 0) + (u.intents.new_program || 0) + (u.intents.grant || 0) >= 2 || (u.capabilityAsks.web_research || 0) >= 1))
    add({ id: "setup-local-server", kind: "setup", priority: "high", title: "Run the local server with an API key",
      evidence: `${(u.intents.research || 0) + (u.intents.new_program || 0) + (u.intents.grant || 0)} research, program or grant requests answered without web access.`,
      why: "The claude.ai version cannot search the web, hear you, or change your computer's volume.", missing: "Node.js on your computer, an Anthropic API key, and `npm start` in the otter folder.", unlocks: "research with citations, hold hands-free conversations, and control the computer's volume with your approval.", effort: "About 15 minutes once; API usage is billed to the key." });

  if (env.engineKind === "server" && !env.webResearch && (u.intents.research || 0) + (u.intents.new_program || 0) + (u.intents.grant || 0) >= 1)
    add({ id: "perm-web", kind: "setting", priority: "medium", title: "Turn on web research", evidence: "You asked research questions while it was off.", why: "Answers rely on what you paste.", missing: "Settings > Permissions > Public web research.", unlocks: "cite current labor-market, grant and policy sources.", effort: "One switch." });

  for (const [topic, n] of Object.entries(u.noSkillTopics))
    if (n >= 3)
      add({ id: "skill-" + topic, kind: "skill", priority: "medium", title: `A new Claude skill for "${topic.replace(/_/g, " ")}"`,
        evidence: `${n} requests on this topic matched none of your ${env.skillCount || ""} skills.`,
        why: "Each time, the work starts from scratch with no house format or checklist.", missing: "A SKILL.md capturing your format, sources and rules. Your skill-creator skill can draft it from two or three good examples.", unlocks: "produce the same deliverable the same way every time, and plan it alongside your other skills.", effort: "One session with skill-creator." });

  if ((u.intents.fte || 0) >= 2 && !(u.sourceKinds.document > 0))
    add({ id: "fte-routine", kind: "skill", priority: "low", title: "Attach the Conclusive FTE export when you ask about FTE", evidence: `${u.intents.fte} FTE questions without a data file.`, why: "No connector exists for Conclusive Systems, so I only see FTE numbers you paste or upload.", missing: "The CSV export added as a source (paste it), or the fte-report skill run in Cowork.", unlocks: "compute zero-credit and CE/WFT FTE totals and check them against other documents.", effort: "Paste the CSV." });

  if (u.turns >= 8 && (env.knowledgeCount || 0) === 0)
    add({ id: "knowledge-seed", kind: "setting", priority: "low", title: "Let O.T.T.E.R. keep a few standing facts", evidence: `${u.turns} conversations and an empty knowledge base.`, why: "You repeat context that could be remembered.", missing: "Ask me to \"save that to the knowledge base\" and approve the proposal.", unlocks: "bring current facts (budgets, contacts by role, standing decisions) into answers automatically.", effort: "One approval per fact." });

  const v = env.voice || {};
  if (v.synthesis && !v.maleVoiceNatural)
    add({ id: "voice-natural", kind: "setup", priority: "medium", title: "Install or allow a natural male voice", evidence: v.maleVoice ? `Currently speaking as "${v.maleVoice}".` : "No male voice is available.", why: "The voice sounds synthetic.", missing: v.cloudMaleVoice && !v.cloudVoicesAllowed ? `Allow online voices in Settings > Voice to use "${v.cloudMaleVoice}" (text is sent to ${v.cloudVendor || "the browser maker"}).` : "Mac: download Evan or Nathan (Enhanced) under Spoken Content. Windows: use Microsoft Edge.", unlocks: "talk in a voice that sounds like a person.", effort: "A few minutes." });
  if (v.premiumWanted)
    add({ id: "voice-premium", kind: "connector", priority: "low", title: "A premium neural voice service", evidence: "You asked for a more human voice than the browser offers.", why: "Browser voices are the ceiling without an outside text-to-speech service.", missing: "An account and API key with a text-to-speech provider, BMCC approval to send response text to it, and a build step.", unlocks: "speak with studio-quality voices.", effort: "A vendor decision plus one build change." });

  const rank = { high: 0, medium: 1, low: 2 };
  return recs.sort((a, b) => rank[a.priority] - rank[b.priority]);
}

// Periodic nudge: at most one per 3 days, or immediately for a new high-priority item.
function dueRecommendation(usage, recs, now = Date.now()) {
  const fresh = recs.filter((r) => !usage.shown[r.id]);
  if (!fresh.length) return null;
  const top = fresh[0];
  if (top.priority === "high" || now - (usage.lastShownAt || 0) > 3 * 86400000) return top;
  return null;
}

function markShown(usage, rec, now = Date.now()) {
  usage.shown[rec.id] = now;
  usage.lastShownAt = now;
}

function recommendationMarkdown(r) {
  return [
    ":::suggestion",
    `**${r.title}** (${r.kind}, ${r.priority} priority)`,
    "",
    `- **What I noticed:** ${r.evidence}`,
    `- **Why it matters:** ${r.why}`,
    `- **The missing piece:** ${r.missing}`,
    `- **With that piece, I could:** ${r.unlocks}`,
    `- **Effort:** ${r.effort}`,
    ":::",
  ].join("\n");
}

// ---- core/voicecmd.js ----
// Local commands that never go to Claude: speaking volume, computer volume, voice and
// listening controls. Parsed before a message is sent so "louder" costs no usage.

const NUM = /(\d{1,3})\s*(?:%|percent)?/;

function parseCommand(text) {
  const t = String(text || "").toLowerCase().trim().replace(/[.!?]+$/, "");
  if (!t || t.length > 80) return null;
  const system = /\b(computer|system|laptop|pc|mac|machine|windows|speaker)s?\b/.test(t);
  const target = system ? "system" : "voice";
  let m;
  if ((m = t.match(/\b(?:set|put|change|make|turn)?\s*(?:the |my )?(?:computer |system |laptop |pc |mac |machine )?(?:volume|sound)\s*(?:level\s*)?(?:to|at)\s+/)) && NUM.test(t.slice(m.index + m[0].length))) {
    const level = Math.max(0, Math.min(100, parseInt(t.slice(m.index + m[0].length).match(NUM)[1], 10)));
    return { kind: "volume_set", target, level };
  }
  if (/^(?:please )?(?:louder|volume up|speak up|turn (?:it |the volume |that )?up|raise (?:the |your )?(?:volume|voice)|(?:a bit |a little )?louder please)\b/.test(t) || /\b(?:turn up|raise) (?:the )?(?:computer |system )?volume\b/.test(t))
    return { kind: "volume_step", target, step: +15 };
  if (/^(?:please )?(?:quieter|softer|volume down|turn (?:it |the volume |that )?down|lower (?:the |your )?(?:volume|voice))\b/.test(t) || /\b(?:turn down|lower) (?:the )?(?:computer |system )?volume\b/.test(t))
    return { kind: "volume_step", target, step: -15 };
  if (/^(?:mute|be quiet|stop talking|silence|hush)(?: please)?$/.test(t)) return { kind: "mute" };
  if (/^(?:unmute|start talking|talk to me|speak again|voice on)(?: please)?$/.test(t)) return { kind: "unmute" };
  if (/^(?:stop listening|pause listening|stop the conversation|end conversation|conversation off)(?: please)?$/.test(t)) return { kind: "listen_off" };
  if (/^(?:start listening|conversation on|let'?s talk|start (?:a )?conversation)(?: please)?$/.test(t)) return { kind: "listen_on" };
  if (/^(?:what(?:'s| is) (?:the |my )?volume|current volume|volume\??)$/.test(t)) return { kind: "volume_query", target };
  if (/^(?:maximi[sz]e|full screen|open (?:the )?(?:full|big) (?:view|window|screen)|go big|expand)(?: (?:it|the window|please))*$/.test(t)) return { kind: "ui", ui: "maximize" };
  if (/^(?:minimi[sz]e|shrink|go small|mini(?: mode)?|just the otter|get out of the way)(?: (?:it|the window|please))*$/.test(t)) return { kind: "ui", ui: "minimize" };
  if (/^(?:(?:show|open)(?: me)? (?:the )?chat|let me type|type (?:it|instead))(?: please)?$/.test(t)) return { kind: "ui", ui: "chat" };
  if (/^(?:hide|close) (?:the )?chat(?: please)?$/.test(t)) return { kind: "ui", ui: "hide_chat" };
  if (/^(?:float|stay on top|pop out|float (?:on top|the window)|keep (?:it|yourself) on top)(?: please)?$/.test(t)) return { kind: "ui", ui: "float" };
  if (/^(?:look(?: at (?:my|the) screen)?|watch (?:my|the) screen|see (?:my|the) screen|take a look)(?: please)?$/.test(t)) return { kind: "screen", on: true };
  if (/^(?:stop (?:looking|watching)|don'?t look|go to sleep|sleep|nap time)(?: please)?$/.test(t)) return { kind: "screen", on: false };
  if (/^(?:shut (?:down|off|it off|yourself off)|turn (?:off|yourself off)|power (?:off|down)|close otter|otter off|goodbye otter|good night)(?: please)?$/.test(t)) return { kind: "shutdown" };
  if (/^(?:done|i'?m done|all done|got it|that'?s it|that'?s all|finished|close (?:it|that|the list))(?: thanks| thank you)?$/.test(t)) return { kind: "done" };
  if (/^(?:what did you (?:spot|notice|find)|anything i(?:'ve| have)? missed|what am i missing|what should i know)\??$/.test(t)) return { kind: "spotted" };
  if (/^(?:what do you know about me|what have you learned(?: about me)?|what do you remember(?: about me)?)\??$/.test(t)) return { kind: "profile" };
  if (/^(?:yes|yeah|yep|sure|ok(?:ay)?|please do|remember (?:it|that)|keep it|go ahead)(?: please)?$/.test(t)) return { kind: "confirm", yes: true };
  if (/^(?:no|nope|don't|do not|forget it|skip(?: it)?|never mind|nevermind)(?: thanks)?$/.test(t)) return { kind: "confirm", yes: false };
  return null;
}

// Wake phrase: in helper mode O.T.T.E.R. acts only on speech that starts with "Hey Otter" or
// on a reply said right after it spoke. Speech recognizers often hear "otter" as "other",
// "odder" or "auto", and "hey" as "hay" or "a", so those spellings are accepted too.
const WAKE = /^\s*(?:hey|hay|hi|a|ok|okay)[,\s]+(?:otter|odder|other|auto|outer|ottar|order)\b[,.!?:;\s]*/i;
function parseWake(text, { followUp = false } = {}) {
  const t = String(text || "").trim();
  const m = t.match(WAKE);
  if (m) return { addressed: true, text: t.slice(m[0].length).trim() };
  return { addressed: !!followUp, text: t };
}
